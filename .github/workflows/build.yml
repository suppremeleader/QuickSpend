                          bubbleMotion=null;
                          if (dismiss) { dismissingBubble=false; hideBubble(); updateOverlay(); Toast.makeText(FloatingCaptureService.this, tr("Hidden · payment kept in Review"), Toast.LENGTH_SHORT).show(); }
                          else getSharedPreferences(PREFS, 0).edit().putInt("x", bubbleParams.x).putInt("y", bubbleParams.y).apply();
                      }
