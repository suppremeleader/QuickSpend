              private static final Pattern DEBIT = Pattern.compile("(?i)debited|spent|paid|withdrawn|sent|purchase|transferred|payment of|txn of");
              private static final Pattern CREDIT = Pattern.compile("(?i)credited|received|deposited|refund");
              private static final Pattern MERCHANT = Pattern.compile("(?i)\\b(?:at|to|from)\\s+(?!a/c|ac\\b|acct|your|the\\b|vpa|you\\b|rs\\b|inr\\b)([A-Za-z][A-Za-z0-9@ &._*-]{1,28}?)(?=\\s+(?:on|ref|via|upi|using|from|to|dt|date|avl|bal|not|if|call)\\b|[.,;]|$)");
              public final double amount;
              public final String type;
              public final String merchant;
              private PaymentParser(double amount, String type, String merchant) {
