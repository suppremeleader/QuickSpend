              private void animateBubble(int targetX, int targetY, boolean dismiss) {
                  if (bubble == null) return;
                  if (bubbleMotion != null) { bubbleMotion.cancel(); bubbleMotion=null; }
                  final View target=bubble; final int fromX=bubbleParams.x, fromY=bubbleParams.y;
                  dismissingBubble=dismiss;
