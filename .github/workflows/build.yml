                  this.type = type;
                  this.merchant = merchant;
              }
              public static PaymentParser parse(JSONObject item) {
                  if (UpiPayment.isAppAlert(SmsStore.key(item))) {
                      return new PaymentParser(item.optDouble("amount", 0), item.optString("kind", "Income"), item.optString("merchant", "UPI payment"));
                  }
                  return parse(item.optString("from"), item.optString("body"));
              }
              public static PaymentParser parse(String from, String body) {
                  String text = (body == null ? "" : body).replaceAll("\\s+", " ").trim();
                  Matcher amountMatcher = AMOUNT.matcher(text);
                  double amount = 0;
                  while (amountMatcher.find()) {
                      String prefix = text.substring(Math.max(0, amountMatcher.start() - 18), amountMatcher.start());
                      if (BALANCE.matcher(prefix).find()) continue;
                      try { amount = Double.parseDouble(amountMatcher.group(1).replace(",", "")); } catch (NumberFormatException ignored) { }
                      if (amount > 0 && !Double.isInfinite(amount)) break;
                  }
                  if (amount <= 0) {
                      Matcher fallback = Pattern.compile("(?i)(?:debited|credited)\\s+(?:by|for|with)?\\s*(?:rs\\.?|inr)?\\s*([0-9][0-9,]*(?:\\.[0-9]+)?)").matcher(text);
                      if (fallback.find()) try { amount = Double.parseDouble(fallback.group(1).replace(",", "")); } catch (NumberFormatException ignored) { }
                  }
                  Matcher debit = DEBIT.matcher(text), credit = CREDIT.matcher(text);
                  int d = debit.find() ? debit.start() : -1, c = credit.find() ? credit.start() : -1;
                  String type = d < 0 ? "Income" : c < 0 || d < c ? "Expense" : "Income";
                  String merchant = "Bank payment";
                  Matcher merchantMatcher = MERCHANT.matcher(text);
                  if (merchantMatcher.find()) merchant = merchantMatcher.group(1).trim();
                  if (merchant.length() > 32) merchant = merchant.substring(0, 32);
                  if (Double.isNaN(amount) || Double.isInfinite(amount)) amount = 0;
                  return new PaymentParser(amount, type, merchant);
              }
