                  }
                  return result;
              }
              private void updateOverlay() {
                  try {
                      applyPalette();
                      if (!enabled(this) || !Settings.canDrawOverlays(this)) { hideAll(); stopSelf(); return; }
                      if (appVisible || screenLocked()) { hideAll(); return; }
                      if (dismissingBubble||capturePhotoOpen) return;
                      if (hiddenUntilNextPayment) { hideAll(); return; }
                      List<JSONObject> q = payments();
                      if (q.isEmpty()) { hideAll(); return; }
                      if (panel != null) {
                          boolean stillPending = false;
                          for (JSONObject item : q) if (SmsStore.key(item).equals(panelKey)) stillPending = true;
                          if (stillPending) return;
                          hidePanel();
                      }
                      showBubble(q.size());
                      CaptureRecovery.visible(this);
                      android.util.Log.i("QuickSpend", "Capture bubble visible; pending=" + q.size());
                  } catch (RuntimeException e) {
                      lastError = "Floating shortcut is unavailable. Your payment is still available in QuickSpend.";
                      hideAll();
                  }
              }
