                  quickLayer.bubbleX=icon[0]-origin[0];quickLayer.bubbleY=icon[1]-origin[1];
                  int target=quickLayer.targetForSlide(dx,dy,rawX-origin[0],rawY-origin[1]);
                  if(target!=quickLayer.selected&&target>=0)bubble.performHapticFeedback(android.view.HapticFeedbackConstants.KEYBOARD_TAP);
                  quickLayer.selected=target;quickLayer.invalidate();
              }
              private void hideQuickAccess(){if(quickLayer!=null){try{windows.removeView(quickLayer);}catch(RuntimeException ignored){}quickLayer=null;}quickItem=null;quickPayment=null;quickCategories=null;}
              private void finishQuickAccess(float dx,float dy,float rawX,float rawY,long held,int oldX,int oldY) {
                  hideTether();updateQuickAccess(dx,dy,rawX,rawY);
                  int slot=quickLayer==null?-1:quickLayer.selected;
                  if(UpdatePush.required(this)>0||slot<0||quickPayment==null||quickCategories==null||SmsStore.requiresReview(this,quickItem)||slot>=quickCategories.length||!QuickAccessPolicy.canSave(QuickAccessConfig.enabled(this),held,(float)Math.hypot(dx,dy),dp(18),slot,quickPayment.amount,screenLocked()||appVisible,quickLayer.targetActive)) {hideQuickAccess();animateBubble(oldX,oldY,false);return;}
                  try {
                      JSONObject item=quickItem;PaymentParser payment=quickPayment;String category=quickCategories[slot];
                      JSONObject entry=new JSONObject().put("t",payment.type).put("a",payment.amount).put("note","").put("c",category).put("m",payment.merchant).put("who","").put("ts",item.optLong("ts",System.currentTimeMillis())).put("settled",0).put("smsFrom",item.optString("from")).put("smsBody",item.optString("body"));
                      dismissingBubble=true;
                      boolean saved=SmsStore.complete(this,SmsStore.key(item),item.optBoolean("demo")?null:entry);
                      String message=item.optBoolean("demo")?"Preview only. No record added.":saved?"Good job! Payment logged.":"This payment was already handled";
                      Toast.makeText(this,tr(message),Toast.LENGTH_SHORT).show();
                      final View released=bubble;final int chosen=slot;int[] layerOrigin=new int[2],bubbleOrigin=new int[2];quickLayer.getLocationOnScreen(layerOrigin);released.getLocationOnScreen(bubbleOrigin);
                      final float[] target=quickLayer.categoryPosition(chosen);
                      final float targetX=layerOrigin[0]+target[0]-bubbleOrigin[0]-dp(30),targetY=layerOrigin[1]+target[1]-bubbleOrigin[1]-dp(30);hideQuickAccess();
                      Runnable finish=()->{if(bubble==released){hideBubble();updateOverlay();}};
                      if(motionEnabled()&&released!=null){released.animate().translationX(targetX).translationY(targetY).alpha(0).setDuration(260).withEndAction(finish).start();}else finish.run();
                  } catch(Exception e){dismissingBubble=false;hideQuickAccess();animateBubble(oldX,oldY,false);Toast.makeText(this,tr("Could not save. Check free storage and try again."),Toast.LENGTH_LONG).show();}
              }
