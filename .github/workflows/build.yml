                  bubbleMotion=ValueAnimator.ofFloat(0, 1);
                  bubbleMotion.setDuration(motionEnabled() ? (dismiss ? 320 : 280) : 0);
                  bubbleMotion.setInterpolator(dismiss ? new AccelerateInterpolator(1.4f) : new OvershootInterpolator(0.8f));
                  bubbleMotion.addUpdateListener(animation -> {
