                  JSONObject payment=new JSONObject().put("id",1).put("m",parsed.merchant)
                      .put("a",parsed.amount).put("kind",parsed.type).put("acc",account).put("sourceKey",key)
                      .put("sourceApp",item.optString("from")).put("demo",item.optBoolean("demo"))
