              private long lastUpdateCheck;
              private void refreshRequiredUpdate() {
                  long now=android.os.SystemClock.elapsedRealtime();
                  if(lastUpdateCheck!=0&&now-lastUpdateCheck<30*60*1000L)return;
                  lastUpdateCheck=now;
                  try{
                      com.google.android.play.core.appupdate.AppUpdateManagerFactory.create(this).getAppUpdateInfo()
                          .addOnSuccessListener(info->UpdatePush.recordAvailability(this,info));
                  }catch(RuntimeException ignored){}
              }
              private boolean checkingUpdate;
              private void openCapture(JSONObject item) {
                  if(UpdatePush.required(this)>0){showRequiredUpdate(item);return;}
                  if(checkingUpdate)return;
                  checkingUpdate=true;
                  try{
                      com.google.android.play.core.appupdate.AppUpdateManagerFactory.create(this).getAppUpdateInfo()
                          .addOnSuccessListener(info->{checkingUpdate=false;UpdatePush.recordAvailability(this,info);openCheckedCapture(item);})
                          .addOnFailureListener(error->{checkingUpdate=false;openCheckedCapture(item);});
                  }catch(RuntimeException e){checkingUpdate=false;openCheckedCapture(item);}
              }
              private void openCheckedCapture(JSONObject item) {
                  if(bubble==null||appVisible||screenLocked())return;
                  boolean pending=false;
                  for(JSONObject candidate:payments())if(SmsStore.key(candidate).equals(SmsStore.key(item)))pending=true;
                  if(!pending)return;
                  if(UpdatePush.required(this)>0)showRequiredUpdate(item);else showPanel(item);
              }
