                  append(frame,text(tr("Update QuickSpend to keep using the app."),14,MUTED),10);
                  Button update=button("Update now",true);append(frame,update,16);
                  update.setOnClickListener(v->{try{startActivity(UpdatePush.storeIntent(this));hidePanel();}catch(RuntimeException e){Toast.makeText(this,tr("Could not open Google Play"),Toast.LENGTH_SHORT).show();}});
                  WindowManager.LayoutParams lp=new WindowManager.LayoutParams(Math.min(dp(360),display().widthPixels-dp(32)),-2,windowType(),WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL|WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,PixelFormat.TRANSLUCENT);
                  lp.gravity=Gravity.CENTER;
