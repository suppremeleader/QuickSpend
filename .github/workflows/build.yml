          package com.quickspend.app;
          public final class CaptureMotion {
              private CaptureMotion() { }
              public static float[] exit(float x, float y, float dx, float dy, float width, float height, float margin) {
                  float magnitude=(float)Math.hypot(dx,dy);
                  if (magnitude < 1) return new float[]{x, -margin};
                  float ux=-dx/magnitude, uy=-dy/magnitude;
                  float tx=ux > .0001f ? (width+margin-x)/ux : ux < -.0001f ? (-margin-x)/ux : Float.POSITIVE_INFINITY;
                  float ty=uy > .0001f ? (height+margin-y)/uy : uy < -.0001f ? (-margin-y)/uy : Float.POSITIVE_INFINITY;
                  float t=Math.max(0,Math.min(tx,ty));
                  return new float[]{x+ux*t,y+uy*t};
              }
          }
