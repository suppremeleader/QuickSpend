                      quickItem=new JSONObject(q.get(0).toString());quickPayment=PaymentParser.parse(quickItem);
                      quickCategories=QuickAccessConfig.carousel(this,quickPayment.type);
                      String amount=("Income".equals(quickPayment.type)?"+₹":"−₹")+quickPayment.amountText();
                      int[] anchor=new int[2];bubble.getLocationOnScreen(anchor);quickAnchorX=anchor[0]+dp(30);quickAnchorY=anchor[1]+dp(30);
                      quickLayer=new QuickAccessOverlay(this,quickCategories,amount,quickPayment.type,lightMode);
                      WindowManager.LayoutParams lp=new WindowManager.LayoutParams(-1,-1,windowType(),WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,PixelFormat.TRANSLUCENT);
                      lp.gravity=Gravity.TOP|Gravity.START;lp.alpha=.75f;windows.addView(quickLayer,lp);
                      if(motionEnabled()){quickLayer.setAlpha(0);quickLayer.animate().alpha(1).setDuration(140).start();}
                      QuickAccessOverlay layer=quickLayer;
