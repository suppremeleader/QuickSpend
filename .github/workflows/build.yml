              private List<JSONObject> payments() {
                  JSONArray q = SmsStore.pending(this);
                  List<JSONObject> result = new ArrayList<>();
                  for (int i = 0; i < q.length(); i++) {
                      JSONObject item = q.optJSONObject(i);
                      if (item != null && !deferredPayments.contains(SmsStore.key(item)) && PaymentParser.parse(item).amount > 0) {
                          if (item.optBoolean("demo")) return java.util.Collections.singletonList(item);
                          result.add(item);
