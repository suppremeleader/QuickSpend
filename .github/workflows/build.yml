          # This temporary test key signs only disposable verification APKs, never the upload bundle.
          keytool -genkeypair -keystore "$RUNNER_TEMP/qs-validation.jks" -storepass android -keypass android -alias validation -dname "CN=QuickSpend package validation" -keyalg RSA -keysize 2048 -validity 2 > /dev/null 2>&1
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/qs-validation.apks" --mode=universal --ks="$RUNNER_TEMP/qs-validation.jks" --ks-key-alias=validation --ks-pass=pass:android --key-pass=pass:android
          unzip -t "$RUNNER_TEMP/qs-validation.apks" > /dev/null
          rm -f "$RUNNER_TEMP/qs-validation.jks"

          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --module=base > dist/AndroidManifest.xml
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          import json
          ns = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse('dist/AndroidManifest.xml').getroot()
          assert root.get('package') == 'com.quickspend.app', 'Unexpected application ID'
          assert int(root.find('uses-sdk').get(ns + 'targetSdkVersion')) >= 36, 'Target API must be at least 36'
          assert root.find('application').get(ns + 'debuggable', 'false') == 'false', 'Release is debuggable'
          activity = next(node for node in root.find('application').findall('activity') if node.get(ns + 'name', '').endswith('MainActivity'))
          picker = next(node for node in root.find('application').findall('activity') if node.get(ns + 'name', '').endswith('CapturePhotoActivity'))
          assert picker.get(ns + 'exported') == 'false', 'Photo picker must remain private'
          provider = next(node for node in root.find('application').findall('provider') if node.get(ns + 'authorities') == 'com.quickspend.app.capturephotos')
          assert provider.get(ns + 'exported') == 'false' and provider.get(ns + 'grantUriPermissions') == 'true', 'Camera provider scope is incorrect'
          assert activity.get(ns + 'enableOnBackInvokedCallback') == 'true', 'Predictive Back support missing'
          receivers = root.find('application').findall('receiver')
          assert len([r for r in receivers if 'QsWidgets$' in r.get(ns + 'name', '')]) == 3, 'Three widgets must be packaged'
          assert any(r.get(ns + 'name', '').endswith('QsReminderReceiver') and r.get(ns + 'exported') == 'false' for r in receivers), 'Private reminder receiver missing'
          assert any(p.get(ns + 'name') == 'android.permission.RECEIVE_BOOT_COMPLETED' for p in root.findall('uses-permission')), 'Reminder reboot recovery missing'

          permissions = {p.get(ns + 'name') for p in root.findall('uses-permission')}
          assert not permissions.intersection({'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'}), 'Microphone permissions must remain absent while recording is deferred'
          assert not any(node.get(ns + 'name') == 'android.hardware.microphone' for node in root.findall('uses-feature')), 'Deferred recording must not filter devices by microphone'
          assert {'android.permission.POST_NOTIFICATIONS', 'android.permission.RECEIVE_SMS', 'android.permission.SYSTEM_ALERT_WINDOW', 'android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE'} <= permissions, 'Native permissions missing'
          service = next((node for node in root.find('application').findall('service') if node.get(ns + 'name', '').endswith('FloatingCaptureService')), None)
          assert service is not None and service.get(ns + 'exported') == 'false', 'Overlay service missing or exported'
          service_type = service.get(ns + 'foregroundServiceType', '')
          def has_special_use(value):
              if 'specialUse' in value.split('|'):
                  return True
              try:
                  return bool(int(value, 0) & 0x40000000)
              except ValueError:
                  return False
          assert has_special_use(service_type), f'Overlay service specialUse flag missing: {service_type!r}'
          assert service.find('property') is not None, 'Foreground service use-case explanation missing'
          listener = next(node for node in root.find('application').findall('service') if node.get(ns+'name','').endswith('PhonePeNotificationListener'))
          assert listener.get(ns+'permission') == 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE'
          assert listener.get(ns+'exported') == 'false'
          assert any(a.get(ns+'name') == 'android.service.notification.NotificationListenerService' for a in listener.findall('./intent-filter/action'))

          recovery = next(node for node in root.find('application').findall('service') if node.get(ns + 'name', '').endswith('CaptureRecoveryJob'))
          assert recovery.get(ns + 'permission') == 'android.permission.BIND_JOB_SERVICE' and recovery.get(ns + 'exported') == 'true', 'Recovery job must only be bindable by Android'
          with ZipFile('android/app/build/outputs/bundle/release/app-release.aab') as archive:
              assert any(name.endswith('/raw/qs_capture_appear.mp3') for name in archive.namelist()), 'Missing floater appearance sound'
              dex = [archive.read(n) for n in archive.namelist() if n.startswith('base/dex/') and n.endswith('.dex')]
              assert any(b'quickSpendSystemBack' in data for data in dex), 'Native Back-to-JavaScript handler missing'
              for cls in (b'Lcom/quickspend/app/SmsBridgePlugin;', b'Lcom/quickspend/app/SmsReceiver;', b'Lcom/quickspend/app/FloatingCaptureService;', b'Lcom/quickspend/app/SmsStore;', b'Lcom/quickspend/app/PaymentParser;', b'Lcom/quickspend/app/PhonePeNotificationListener;', b'Lcom/quickspend/app/UpiPayment;', b'Lcom/quickspend/app/CaptureCatalog;', b'Lcom/quickspend/app/QuickAccessConfig;', b'Lcom/quickspend/app/QuickAccessPolicy;', b'Lcom/quickspend/app/QuickAccessOverlay;', b'Lcom/quickspend/app/CaptureSound;', b'Lcom/quickspend/app/CaptureSoundPolicy;', b'Lcom/quickspend/app/CaptureRecovery;', b'Lcom/quickspend/app/CaptureRecoveryJob;', b'Lcom/quickspend/app/CaptureWakePolicy;', b'Lcom/quickspend/app/CaptureMotion;', b'Lcom/quickspend/app/QsLanguage;', b'Lcom/quickspend/app/AccountBridgePlugin;', b'Lcom/quickspend/app/UpdateBridgePlugin;', b'Lcom/quickspend/app/UpdateMessagingService;'):
                  assert any(cls in data for data in dex), 'Bundle missing native class: ' + cls.decode()
              for method in ('quickAccessSettings', 'setQuickAccessSettings', 'overlayStatus', 'openOverlaySettings', 'setOverlayEnabled', 'testOverlay', 'setLanguage', 'upiCaptureStatus', 'setUpiCapture', 'openUpiNotificationAccess'):
                  assert any(method.encode() + bytes([0]) in data for data in dex), 'Native floating method missing: ' + method
              assert any(n.endswith('/qs_brand_icon.png') for n in archive.namelist()), 'Native brand icon missing'
              assert 'base/assets/public/locales/hi.json' in archive.namelist(), 'Hindi translations missing'
              assert 'base/assets/public/assets/quickspend-icon.png' in archive.namelist(), 'Web icon asset missing'
              html = archive.read('base/assets/public/index.html').decode()
              assert html == Path('index.html').read_text(), 'Packaged app does not match the reviewed source'
              assert 'function subscriptionsPage(' in html and 'function savingsPage(' in html, 'Planning screens missing'
              assert any('qs_widget' in n for n in archive.namelist()), 'Widget resources missing'
              assert 'nativePromise' in html and 'floating-capture-11' in html, 'Outdated floating-capture HTML bridge'
              assert 'id="note-picture"' in html and 'function addNotePicture(' in html, 'PR 14 picture-note controls missing from packaged app'
              assert 'emi-entry-plans' in html and 'function selectEmiPlan(' in html, 'PR 13 existing EMI selection missing from packaged app'
              assert "<span>${L('Existing EMI')}</span>" not in html, 'PR 13 duplicate EMI heading has returned'
              assert 'async function toggleVoiceNote' not in html and 'getUserMedia' not in html, 'Voice recording must remain deferred'

              assert any(n.startswith('META-INF/') and n.upper().endswith(('.RSA', '.DSA', '.EC')) for n in archive.namelist()), 'Bundle has no signing certificate'
          meta = json.loads(Path('release-metadata.json').read_text())
          assert int(root.get(ns + 'versionCode')) == meta['versionCode'], 'Version code mismatch'
          meta['verification'] = 'passed'
          meta['releaseChecks'] = {'pr21IsolatedBudgetAndRailSettings': 'passed', 'pr20CarouselAndNativeCategoryIcons': 'passed', 'pr19BudgetAndSettings': 'passed', 'pr18LaterAndDiscard': 'passed', 'universalApkGeneration': 'passed', 'planningSavingsWidgets': 'passed', 'qui30VectorIconsAndEmiDisclosure': 'passed', 'pr17LinkedEmiCompletion': 'passed', 'pr16ExpenseEmiEditor': 'passed', 'pr12NativeBack': 'passed', 'pr13EmiHeading': 'passed', 'pr14PictureNotes': 'passed', 'voiceRecordingDeferred': 'passed'}
          Path('dist/build-evidence.json').write_text(json.dumps(meta, indent=2))
          print('VERIFIED: signed release AAB, API 36, SMS bridge, native floating capture, receiver, permissions and version code.')
          PY_VERIFY
          cp "$AAB" "dist/quickspend-build-${GITHUB_RUN_NUMBER}.aab"
          sha256sum "dist/quickspend-build-${GITHUB_RUN_NUMBER}.aab" > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quickspend-play-bundle-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14




