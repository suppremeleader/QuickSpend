                      windowType(),WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL|WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT);
                  lp.gravity=Gravity.BOTTOM|Gravity.CENTER_HORIZONTAL;
                  lp.softInputMode=WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE;
                  frame.setOnTouchListener((v,event)->{if(event.getAction()==MotionEvent.ACTION_OUTSIDE&&!capturePhotoOpen){collapsePanel();return true;}return false;});
                  ViewCompat.setOnApplyWindowInsetsListener(frame,(v,insets)->{
                      int top=insets.getInsets(WindowInsetsCompat.Type.systemBars()).top;
                      int bottom=Math.max(insets.getInsets(WindowInsetsCompat.Type.systemBars()).bottom,insets.getInsets(WindowInsetsCompat.Type.ime()).bottom);
                      int available=Math.max(dp(100),display().heightPixels-top-bottom);
                      int height=Math.min(dp(750),available);
                      if(lp.height!=height&&panel==frame){lp.height=height;try{windows.updateViewLayout(frame,lp);}catch(RuntimeException ignored){}}
                      return insets;
                  });
                  try{
                      captureEntry=new CaptureEntryView(this,captureState(item),(message,reply)->{
                          if(panel==frame)handleCaptureAction(frame,item,message,reply);
                      });
                      frame.addView(captureEntry,new LinearLayout.LayoutParams(-1,-1));
                      windows.addView(frame,lp);panel=frame;ViewCompat.requestApplyInsets(frame);
                  }catch(Exception e){releaseCaptureEntry();panelKey=null;updateOverlay();}
              }
              private void handleCaptureAction(LinearLayout frame,JSONObject item,JSONObject message,CaptureEntryView.Reply reply){
                  String action=message.optString("action");
                  String key=SmsStore.key(item);
                  boolean demo=item.optBoolean("demo");
                  try{
                      if("close".equals(action)){collapsePanel();return;}
                      if(UpdatePush.required(this)>0){showRequiredUpdate(item);return;}
                      if("picture".equals(action)){pickCapturePhoto(frame,message.optString("source"),reply);return;}
                      if("addCategory".equals(action)){
                          if(demo){reply.success();return;}
                          if(!CaptureCatalog.add(this,message.optString("type"),message.optString("name"))){
                              reply.error("Choose a unique category name (up to 40 characters).");return;
                          }
                          reply.success();return;
                      }
                      if("later".equals(action)){
                          if(demo)SmsStore.complete(this,key,null);else deferredPayments.add(key);
                      }else if("delete".equals(action)){
                          SmsStore.complete(this,key,null);
                      }else if("openApp".equals(action)&&!demo){
                          openCaptureInApp(item,message.optJSONObject("entry"),message.optString("planning"));return;
                      }else if("save".equals(action)){
                          if(demo){
                              SmsStore.complete(this,key,null);
                              Toast.makeText(this,tr("Preview complete. No expense was added."),Toast.LENGTH_SHORT).show();
                          }else{
                              if(SmsStore.requiresReview(this,item)){openCaptureInApp(item,message.optJSONObject("entry"),"");return;}
                              JSONObject entry=captureRecord(item,message.getJSONObject("entry"),reply);
                              if(entry==null)return;
                              boolean saved=SmsStore.complete(this,key,entry);
                              Toast.makeText(this,tr(saved?"Good job! Payment logged.":"This payment was already handled"),Toast.LENGTH_SHORT).show();
                          }
                      }else{reply.error("Could not save. Try again.");return;}
                      reply.success();hidePanel();updateOverlay();
                  }catch(Exception e){reply.error("Could not save. Try again.");}
              }
              private JSONObject captureRecord(JSONObject item,JSONObject draft,CaptureEntryView.Reply reply) throws org.json.JSONException{
                  String type=draft.optString("type"),category=draft.optString("category"),who=draft.optString("who").trim();
                  double amount=draft.optDouble("amount");
                  if(!Double.isFinite(amount)||amount<=0){reply.error("Enter an amount greater than zero.");return null;}
                  if(!java.util.Arrays.asList("Expense","Income","Lent","Borrowed").contains(type))return null;
                  if(("Lent".equals(type)||"Borrowed".equals(type))&&who.isEmpty()){reply.error("Add the person's name.");return null;}
                  if(!CaptureCatalog.labels(this,type).contains(category))category="Uncategorised";
                  String note=draft.optString("note").trim(),photo=draft.optString("photo");
                  JSONObject entry=new JSONObject().put("t",type).put("a",amount).put("c",category)
                      .put("note",note.substring(0,Math.min(300,note.length()))).put("who",who.substring(0,Math.min(60,who.length())))
                      .put("m",PaymentParser.parse(item).merchant).put("settled",0)
                      .put("ts",item.optLong("ts",System.currentTimeMillis())).put("smsFrom",item.optString("from")).put("smsBody",item.optString("body"));
                  String account=draft.optString("account");
                  if(!account.isEmpty()&&account.length()<=60)entry.put("acc",account);
                  String bankKey=draft.optString("bankKey");
                  if(SmsStore.bankKeyValid(bankKey))entry.put("bankKey",bankKey);
                  if(photo.length()<=180000&&photo.matches("^data:image/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$"))entry.put("photo",photo);
                  if("Expense".equals(type)){
                      int emiIndex=draft.optInt("emiIndex",-1);
                      if(emiIndex>=0){entry.put("emiPlanIndex",emiIndex).put("emiPlanName",draft.optString("emiName"));}
                      else{
                          String subscriptionId=draft.optString("subscriptionId");
                          if(subscriptionId.matches("[a-zA-Z0-9_-]{1,80}"))entry.put("subscriptionId",subscriptionId);
                      }
                  }
                  return entry;
              }
              private void pickCapturePhoto(LinearLayout frame,String source,CaptureEntryView.Reply reply){
                  if(capturePhotoOpen||(!"camera".equals(source)&&!"browse".equals(source))){reply.error("Could not attach this picture.");return;}
                  final boolean[] pickerStarted={false},settled={false};
                  Runnable launchTimeout=()->{
                      if(settled[0]||pickerStarted[0]||panel!=frame)return;
                      settled[0]=true;capturePhotoOpen=false;reply.error("Could not attach this picture.");
                  };
                  android.os.ResultReceiver receiver=new android.os.ResultReceiver(main){
                      @Override protected void onReceiveResult(int result,android.os.Bundle payload){
                          if(settled[0]||panel!=frame)return;
                          main.removeCallbacks(launchTimeout);
                          if(result==3){
                              pickerStarted[0]=true;frame.setVisibility(View.INVISIBLE);return;
                          }
                          settled[0]=true;capturePhotoOpen=false;
                          frame.setVisibility(View.VISIBLE);ViewCompat.requestApplyInsets(frame);
                          if(result==1)reply.send("photo",payload.getString("photo",""));
                          else if(result==2)reply.error("Could not attach this picture.");
                          else reply.success();
                      }
                  };
                  ((InputMethodManager)getSystemService(INPUT_METHOD_SERVICE)).hideSoftInputFromWindow(frame.getWindowToken(),0);
                  try{
                      capturePhotoOpen=true;
                      startActivity(CapturePhotoActivity.launch(this,source,receiver));
                      main.postDelayed(launchTimeout,8000);
                  }catch(RuntimeException e){
                      settled[0]=true;capturePhotoOpen=false;reply.error("Could not attach this picture.");
                  }
              }
              private void releaseCaptureEntry(){
                  if(captureEntry==null)return;
                  android.view.ViewParent parent=captureEntry.getParent();
                  if(parent instanceof LinearLayout)((LinearLayout)parent).removeView(captureEntry);
                  captureEntry.stopLoading();captureEntry.destroy();captureEntry=null;capturePhotoOpen=false;
              }
              private void collapsePanel() {
                  if (panel == null) return;
                  if (!motionEnabled()) { hidePanel(); updateOverlay(); return; }
                  final LinearLayout closing=panel;
                  closing.animate().cancel(); closing.setEnabled(false);
                  closing.animate().alpha(0).scaleX(.94f).scaleY(.94f).translationY(dp(18)).setDuration(150).withEndAction(() -> { if (panel == closing) { hidePanel(); updateOverlay(); } }).start();
              }
              private void hideBubble() { hideDismissTarget(); hideQuickAccess(); hideTether(); if (bubbleMotion != null) { bubbleMotion.cancel(); bubbleMotion=null; } dismissingBubble=false; if (bubble != null) { bubble.animate().cancel(); try { windows.removeView(bubble); } catch (RuntimeException ignored) { } bubble = null; } }
              private void hidePanel() {
                  if (panel != null) {
                      panel.animate().cancel();
                      ((InputMethodManager) getSystemService(INPUT_METHOD_SERVICE)).hideSoftInputFromWindow(panel.getWindowToken(), 0);
                      try { windows.removeView(panel); } catch (RuntimeException ignored) { }
                      panel = null; panelKey = null;releaseCaptureEntry();
                  }
              }
              private void hideAll() { hidePanel(); hideBubble(); }
              @Override public void onConfigurationChanged(Configuration config) { super.onConfigurationChanged(config); if(!capturePhotoOpen){hideAll();updateOverlay();} }
              @Override public void onDestroy() {
                  main.removeCallbacksAndMessages(null); hideAll();
                  if (screenReceiver != null) { try { unregisterReceiver(screenReceiver); } catch (RuntimeException ignored) { } }
                  clearRecovery();instance = null; stopForeground(true); super.onDestroy();
              }
          }
