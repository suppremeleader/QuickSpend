name: Quick Spend Play Console Bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Optional version code; must exceed every version already uploaded to Play'
        required: false
        type: string
      version_name:
        description: 'Optional version name; defaults to package.json version'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check upload signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing GitHub Actions secret: $secret. Follow PLAY_CONSOLE_SETUP.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check payment review regressions
        run: |
          node tests/capture-regression.cjs
          node tests/app-inbox.cjs
          node tests/ledger-reliability.cjs
          node tests/language.cjs
          node tests/budgets.cjs
          node tests/account-layout.cjs
          node tests/account-polish.cjs
          node tests/ftue.cjs
          node tests/dated-emi.cjs
          node tests/emi-regression.cjs
          node tests/appearance-nav.cjs
          node tests/screen-polish.cjs
          node tests/quick-capture-fixes.cjs
          node tests/accounts-delete.cjs
          node tests/home-navigation.cjs
          node tests/update-ui.cjs
          node tests/quick-access.cjs
          node tests/transaction-history.cjs
          node tests/back-navigation.cjs
          node tests/note-attachments.cjs
          node tests/planning.cjs
          python3 -m unittest discover -s tests -p "test_release_watch.py"
          python3 -m unittest discover -s tests -p "test_manifest_config.py"
          python3 -m unittest discover -s tests -p "test_planning_native.py"
      - name: Check phone layouts in Chromium
        timeout-minutes: 6
        run: |
          npm install --prefix /tmp/qs-ui --no-save --ignore-scripts playwright@1.56.1
          /tmp/qs-ui/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/qs-ui/node_modules/playwright node scripts/ui-smoke.cjs
      - name: Upload phone layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-layout-checks
          path: ui-smoke-output/
          if-no-files-found: ignore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Check bubble motion and capture gesture policies
        run: |
          mkdir -p /tmp/qs-motion/com/quickspend/app
          python3 tests/extract-motion.py /tmp/qs-motion/com/quickspend/app/CaptureMotion.java
          javac -d /tmp/qs-motion /tmp/qs-motion/com/quickspend/app/CaptureMotion.java tests/CaptureMotionTest.java
          java -cp /tmp/qs-motion CaptureMotionTest
          javac -d /tmp/qs-motion native/UpdatePolicy.java tests/UpdatePolicyTest.java
          java -cp /tmp/qs-motion UpdatePolicyTest
          javac -d /tmp/qs-motion native/SubscriptionDates.java tests/SubscriptionDatesTest.java
          java -cp /tmp/qs-motion com.quickspend.app.SubscriptionDatesTest
          javac -d /tmp/qs-motion native/QuickAccessPolicy.java tests/QuickAccessPolicyTest.java
          java -cp /tmp/qs-motion QuickAccessPolicyTest
          javac -d /tmp/qs-motion native/CaptureWakePolicy.java tests/CaptureWakePolicyTest.java
          java -cp /tmp/qs-motion CaptureWakePolicyTest
          javac -d /tmp/qs-motion native/CaptureSoundPolicy.java tests/CaptureSoundPolicyTest.java
          java -cp /tmp/qs-motion CaptureSoundPolicyTest
          javac -d /tmp/qs-motion native/UpiPayment.java tests/UpiPaymentTest.java
          java -cp /tmp/qs-motion com.quickspend.app.UpiPaymentTest
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare native SMS bridge and Play release configuration
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ ! -s assets/quickspend-icon.png ]; then
            echo "::error::Missing icon. Upload the assets folder at the repository root along with index.html and .github."
            exit 1
          fi
          mkdir -p www/assets www/locales && cp index.html www/
          cp locales/hi.json www/locales/
          cp assets/quickspend-icon.png assets/ftue.css www/assets/
          npm install
          npm install @capacitor/local-notifications@^6.0.0
          if [ ! -d android ]; then npx cap add android; fi
          D=android/app/src/main/java/com/quickspend/app
          mkdir -p $D android/app/src/main/res/raw
          cp assets/capture-appear.mp3 android/app/src/main/res/raw/qs_capture_appear.mp3
          cp native/CaptureSound.java native/CaptureSoundPolicy.java native/CaptureRecovery.java native/CaptureRecoveryJob.java native/CaptureWakePolicy.java native/CaptureCatalog.java native/QuickAccessConfig.java native/QuickAccessPolicy.java native/QuickAccessOverlay.java native/QsLanguage.java native/AccountBridgePlugin.java native/UpdatePolicy.java native/UpdatePush.java native/UpdateMessagingService.java native/UpdateBridgePlugin.java native/CapturePhotoActivity.java native/CaptureEntryView.java $D/
          if [ -s config/google-services.json ]; then
            mkdir -p android/app/src/main/assets/cloud
            cp config/google-services.json android/app/src/main/assets/cloud/
          fi
          cat >> android/app/build.gradle <<'EOF'
          dependencies {
              implementation "androidx.webkit:webkit:1.11.0"
          }
          EOF
          cat > $D/SmsReceiver.java <<'EOF'
          package com.quickspend.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Telephony;
          import android.telephony.SmsMessage;
          import androidx.core.app.NotificationCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class SmsReceiver extends BroadcastReceiver {
            static final String PREFS = "qs_sms";
            static final String KEY = "queue";
            static final String CH = "qs_pay";
            static final Pattern KW = Pattern.compile("(?i)(debited|credited|spent|paid|received|withdrawn|sent rs|sent inr|purchase|txn|transaction|transferred|refund)");
            static final Pattern BAD = Pattern.compile("(?i)(otp|one.?time|verification code|below minimum|min(imum)? (bal|limit)|payment due|amount due|due on|will be debited|request(ed)? (money|from)|collect request|fail|declin|unsuccess|not processed|offer|apply now|congratulations|pre-?approved)");
            static final Pattern AMT = Pattern.compile("(?i)(?:rs\\.?|inr|\\u20b9)\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)");

            @Override
            public void onReceive(Context c, Intent i) {
              if (!Telephony.Sms.Intents.SMS_RECEIVED_ACTION.equals(i.getAction())) return;
              SmsMessage[] ms = Telephony.Sms.Intents.getMessagesFromIntent(i);
              if (ms == null || ms.length == 0) return;
              StringBuilder b = new StringBuilder();
              for (SmsMessage m : ms) b.append(m.getMessageBody());
              String body = b.toString();
              String from = ms[0].getOriginatingAddress();
              long ts = ms[0].getTimestampMillis();
              if (!KW.matcher(body).find() || BAD.matcher(body).find() || !AMT.matcher(body).find()) return;
              try { SmsStore.enqueue(c, from, body, ts, false); }
              catch (RuntimeException e) { android.util.Log.e("QuickSpend", "Could not store incoming payment", e); }
              try { alert(c, body); } catch (Exception e) { }
            }

            static void push(Context c, String from, String body, long ts) {
              SmsStore.enqueue(c, from, body, ts, false);
            }

            static void alert(Context c, String body) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel(CH, QsLanguage.tr(c,"Payments"), NotificationManager.IMPORTANCE_HIGH));
              }
              Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
              if (li == null) return;
              PendingIntent pi = PendingIntent.getActivity(c, 0, li, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              Matcher m = AMT.matcher(body);
              String amt = m.find() ? "\u20b9" + m.group(1) : QsLanguage.tr(c,"Payment");
              Notification n = new NotificationCompat.Builder(c, CH)
                .setSmallIcon(R.drawable.ic_qs_notification)
                .setContentTitle("Quick Spend: " + amt)
                .setContentText(QsLanguage.tr(c,"Tap to categorise this payment"))
                .setAutoCancel(true)
                .setContentIntent(pi)
                .setPriority(NotificationCompat.PRIORITY_HIGH)
                .build();
              nm.notify((int) (System.currentTimeMillis() % 100000), n);
            }
          }
          EOF
          cat > $D/SmsBridgePlugin.java <<'EOF'
          package com.quickspend.app;

          import android.content.SharedPreferences;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import android.os.Build;
          import android.app.NotificationManager;
          import android.app.NotificationChannel;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
            name = "SmsBridge",
            permissions = {
              @Permission(strings = {"android.permission.RECEIVE_SMS"}, alias = "sms"),
              @Permission(strings = {"android.permission.POST_NOTIFICATIONS"}, alias = "notif")
            }
          )
          public class SmsBridgePlugin extends Plugin {
            @PluginMethod
            public void status(PluginCall call) {
              JSObject r = new JSObject();
              r.put("sms", getPermissionState("sms") == PermissionState.GRANTED);
              r.put("language", QsLanguage.get(getContext()));
              r.put("languageChosen", QsLanguage.chosen(getContext()));
              r.put("bridgeRevision", "floating-capture-11");
              try {
                android.content.pm.PackageInfo info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                r.put("nativeBuild", Build.VERSION.SDK_INT >= 28 ? info.getLongVersionCode() : info.versionCode);
              } catch (android.content.pm.PackageManager.NameNotFoundException e) {
                r.put("nativeBuild", -1);
              }
              boolean allowed = NotificationManagerCompat.from(getContext()).areNotificationsEnabled();
              NotificationManager nm = (NotificationManager) getContext().getSystemService(android.content.Context.NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel channel = nm.getNotificationChannel(SmsReceiver.CH);
                allowed = allowed && (channel == null || channel.getImportance() != NotificationManager.IMPORTANCE_NONE);
              }
              r.put("notif", allowed && (Build.VERSION.SDK_INT < 33 || getPermissionState("notif") == PermissionState.GRANTED));
              call.resolve(r);
            }

            @PluginMethod
            public void request(PluginCall call) {
              if (Build.VERSION.SDK_INT >= 33) requestAllPermissions(call, "done");
              else requestPermissionForAlias("sms", call, "done");
            }

            @PluginMethod
            public void requestSms(PluginCall call) {
              requestPermissionForAlias("sms", call, "done");
            }

            @PluginMethod
            public void requestNotif(PluginCall call) {
              if (Build.VERSION.SDK_INT >= 33) requestPermissionForAlias("notif", call, "done");
              else status(call);
            }

            @PluginMethod
            public void upiCaptureStatus(PluginCall call) {
              JSObject result = new JSObject();
              result.put("enabled", PhonePeNotificationListener.enabled(getContext()));
              result.put("allowed", PhonePeNotificationListener.allowed(getContext()));
              call.resolve(result);
            }

            @PluginMethod
            public void setUpiCapture(PluginCall call) {
              if (!PhonePeNotificationListener.setEnabled(getContext(), Boolean.TRUE.equals(call.getBoolean("enabled")))) {
                call.reject("Could not save. Try again.");
                return;
              }
              upiCaptureStatus(call);
            }

            @PluginMethod
            public void openUpiNotificationAccess(PluginCall call) {
              getActivity().runOnUiThread(() -> {
                try {
                  getActivity().startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS));
                  call.resolve();
                } catch (Exception e) { call.reject("Could not open notification access.", e); }
              });
            }

            @PluginMethod
            public void openNotificationSettings(PluginCall call) {
              Intent intent;
              if (Build.VERSION.SDK_INT >= 26) {
                intent = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                intent.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());
              } else {
                intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                    Uri.parse("package:" + getContext().getPackageName()));
              }
              try {
                getActivity().startActivity(intent);
                call.resolve();
              } catch (Exception e) { call.reject("Could not open notification settings", e); }
            }

            @PluginMethod
            public void openCaptureNotificationSettings(PluginCall call) {
              getActivity().runOnUiThread(() -> {
                try {
                  Intent intent;
                  if (Build.VERSION.SDK_INT >= 26) {
                    intent = new Intent(Settings.ACTION_CHANNEL_NOTIFICATION_SETTINGS);
                    intent.putExtra(Settings.EXTRA_APP_PACKAGE,getContext().getPackageName());
                    intent.putExtra(Settings.EXTRA_CHANNEL_ID,"qs_capture_service");
                  } else intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,Uri.parse("package:"+getContext().getPackageName()));
                  getActivity().startActivity(intent);call.resolve();
                } catch (Exception e) { call.reject("Could not open notification settings",e); }
              });
            }

            @PluginMethod
            public void testNotification(PluginCall call) {
              if (!NotificationManagerCompat.from(getContext()).areNotificationsEnabled()) {
                call.reject("Notifications are disabled. Enable them in notification settings.");
                return;
              }
              try {
                SmsReceiver.alert(getContext(), "Test notification");
                call.resolve();
              } catch (Exception e) { call.reject("Could not post test notification", e); }
            }

            @PermissionCallback
            private void done(PluginCall call) {
              status(call);
            }

            @PluginMethod
            public void drain(PluginCall call) {
              try {
                org.json.JSONObject snapshot = SmsStore.snapshot(getContext());
                JSObject result = new JSObject();
                org.json.JSONArray items = snapshot.getJSONArray("items");
                for (int i = 0; i < items.length(); i++) {
                  org.json.JSONObject item = items.getJSONObject(i);
                  PaymentParser parsed = PaymentParser.parse(item);
                  item.put("amount", parsed.amount).put("kind", parsed.type).put("merchant", parsed.merchant);
                }
                result.put("items", new JSArray(items.toString()));
                result.put("entries", new JSArray(snapshot.getJSONArray("entries").toString()));
                call.resolve(result);
              } catch (Exception e) { call.reject("Could not read native payment inbox", e); }
            }

            @PluginMethod
            public void syncCaptureCatalog(PluginCall call) {
              try {
                org.json.JSONObject config=new org.json.JSONObject(call.getString("payload","{}"));
                JSObject result=new JSObject();
                result.put("customCategories",CaptureCatalog.sync(getContext(),config).toString());
                result.put("bankAccounts",SmsStore.mergeBankAccounts(getContext(),config.optJSONObject("bankAccounts")).toString());
                call.resolve(result);
              }
              catch(Exception e){call.reject("Could not sync categories",e);}
            }

            @PluginMethod
            public void inboxSnapshot(PluginCall call) {
              try {
                org.json.JSONObject snapshot = SmsStore.snapshot(getContext());
                org.json.JSONArray items = snapshot.getJSONArray("items");
                for (int i = 0; i < items.length(); i++) {
                  org.json.JSONObject item = items.getJSONObject(i);
                  PaymentParser parsed = PaymentParser.parse(item);
                  item.put("amount", parsed.amount).put("kind", parsed.type).put("merchant", parsed.merchant);
                }
                JSObject result = new JSObject(); result.put("payload", snapshot.toString()); call.resolve(result);
              } catch (Exception e) { call.reject("Could not read payment inbox", e); }
            }

            @PluginMethod
            public void acknowledgeSaved(PluginCall call) {
              try {
                JSArray keys = call.getArray("keys");
                if (keys == null) { call.reject("Missing saved entry keys"); return; }
                SmsStore.acknowledge(getContext(), keys);
                call.resolve();
              } catch (Exception e) { call.reject("Could not acknowledge saved payments", e); }
            }

            @PluginMethod
            public void completeSms(PluginCall call) {
              String key = call.getString("sourceKey", "");
              if (key.isEmpty()) { call.reject("Missing payment source key"); return; }
              try {
                SmsStore.complete(getContext(), key, null);
                call.resolve();
              } catch (Exception e) { call.reject("Could not complete payment", e); }
            }

            @PluginMethod
            public void clearNativeInbox(PluginCall call) {
              try { SmsStore.clear(getContext()); call.resolve(); }
              catch (Exception e) { call.reject("Could not clear native payment inbox", e); }
            }

            @PluginMethod
            public void pickEntryPicture(PluginCall call) {
              String source=call.getString("source","browse");
              if(!"browse".equals(source)&&!"camera".equals(source)){call.reject("Invalid photo source");return;}
              getActivity().runOnUiThread(()->{
                android.os.ResultReceiver receiver=new android.os.ResultReceiver(new android.os.Handler(android.os.Looper.getMainLooper())){
                  @Override protected void onReceiveResult(int result,android.os.Bundle payload){
                    if(result==3)return;
                    if(result==2){call.reject("Could not attach this picture.");return;}
                    JSObject out=new JSObject();
                    if(result==1)out.put("photo",payload.getString("photo",""));
                    call.resolve(out);
                  }
                };
                try{getActivity().startActivity(CapturePhotoActivity.launch(getActivity(),source,receiver));}
                catch(RuntimeException e){call.reject("Could not attach this picture.",e);}
              });
            }

            @PluginMethod
            public void setCategoryPicker(PluginCall call) {
              try { QsLanguage.setCategoryPicker(getContext(),Boolean.TRUE.equals(call.getBoolean("enabled",false))); call.resolve(); }
              catch (RuntimeException e) { call.reject("Could not save category picker",e); }
            }

            @PluginMethod
            public void setColorMode(PluginCall call) {
              try { QsLanguage.setColorMode(getContext(),call.getString("mode","dark")); if(getActivity()!=null)getActivity().runOnUiThread(()->QsLanguage.applySystemBars(getActivity())); FloatingCaptureService.refresh(getContext(),false); call.resolve(); }
              catch(Exception e){call.reject("Could not save color mode",e);}
            }

            @PluginMethod
            public void setLanguage(PluginCall call) {
              String language = call.getString("language", "");
              getActivity().runOnUiThread(() -> {
                try {
                  QsLanguage.set(getContext(), language);
                  if (FloatingCaptureService.enabled(getContext())) FloatingCaptureService.activityVisible(getContext(), true);
                  JSObject result = new JSObject(); result.put("language", language); call.resolve(result);
                } catch (Exception e) { call.reject("Could not change language. Please try again.", e); }
              });
            }

            @PluginMethod public void quickAccessSettings(PluginCall call) {
                try { JSObject result=new JSObject(); result.put("payload",QuickAccessConfig.read(getContext()).toString()); call.resolve(result); }
                catch(Exception e){call.reject("Could not load Quick Access",e);}
            }
            @PluginMethod public void setQuickAccessSettings(PluginCall call) {
                try { QuickAccessConfig.save(getContext(),new org.json.JSONObject(call.getString("payload","{}"))); FloatingCaptureService.refresh(getContext(),false); call.resolve(); }
                catch(Exception e){call.reject("Could not save Quick Access",e);}
            }
            @PluginMethod
            public void overlayStatus(PluginCall call) {
              JSObject result = new JSObject();
              result.put("allowed", Settings.canDrawOverlays(getContext()));
              result.put("enabled", FloatingCaptureService.enabled(getContext()));
              result.put("running", FloatingCaptureService.running());
              result.put("error", FloatingCaptureService.lastError);
              call.resolve(result);
            }

            @PluginMethod
            public void openOverlaySettings(PluginCall call) {
              getActivity().runOnUiThread(() -> {
                try {
                  getActivity().startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                      Uri.parse("package:" + getContext().getPackageName())));
                  call.resolve();
                } catch (Exception e) { call.reject("Could not open Display over other apps settings", e); }
              });
            }

            @PluginMethod
            public void setOverlayEnabled(PluginCall call) {
              boolean enabled = Boolean.TRUE.equals(call.getBoolean("enabled", false));
              getActivity().runOnUiThread(() -> {
                try {
                  if (enabled && !Settings.canDrawOverlays(getContext())) {
                    call.reject("Allow Display over other apps first"); return;
                  }
                  FloatingCaptureService.setEnabled(getContext(), enabled);
                  if (enabled) FloatingCaptureService.activityVisible(getContext(), true);
                  if (enabled && !FloatingCaptureService.lastError.isEmpty()) { call.reject(FloatingCaptureService.lastError); return; }
                  overlayStatus(call);
                } catch (Exception e) { call.reject("Could not change floating capture setting", e); }
              });
            }

            @PluginMethod
            public void testOverlay(PluginCall call) {
              if (!Settings.canDrawOverlays(getContext()) || !FloatingCaptureService.enabled(getContext()) || !FloatingCaptureService.running()) {
                call.reject("Enable the floating shortcut first"); return;
              }
              try {
                android.content.Context context = getContext().getApplicationContext();
                SmsStore.enqueue(context, "QuickSpend preview", "Rs. 1.00 debited at QuickSpend preview on today", System.currentTimeMillis(), true);
                new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(
                    () -> FloatingCaptureService.refresh(context, false), SmsStore.DEMO_LIFETIME_MS);
                call.resolve();
              } catch (Exception e) { call.reject("Could not prepare test bubble", e); }
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.quickspend.app;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SmsBridgePlugin.class);
              registerPlugin(AccountBridgePlugin.class);
              registerPlugin(UpdateBridgePlugin.class);
              registerPlugin(PlanningBridge.class);
              super.onCreate(savedInstanceState);
              QsLanguage.applySystemBars(this);
              if (android.os.Build.VERSION.SDK_INT >= 26) {
                android.app.NotificationManager nm = (android.app.NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                nm.createNotificationChannel(new android.app.NotificationChannel(SmsReceiver.CH, QsLanguage.tr(this,"Payments"), android.app.NotificationManager.IMPORTANCE_HIGH));
              }
              UpdatePush.configure(this);
              getOnBackPressedDispatcher().addCallback(this,new androidx.activity.OnBackPressedCallback(true) {
                @Override public void handleOnBackPressed() { routeSystemBack(); }
              });
              grab(getIntent());
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              grab(intent);
            }

            @Override
            public void onResume() {
              super.onResume();
              QsLanguage.applySystemBars(this);
              UpdatePush.configure(this);
              FloatingCaptureService.activityVisible(this, true);
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().postDelayed(() -> {
                  if (getBridge() != null && getBridge().getWebView() != null) getBridge().getWebView().evaluateJavascript("window.dispatchEvent(new Event('quickspendResume'))", null);
                }, 300);
              }
            }

            @Override
            public void onPause() {
              FloatingCaptureService.activityVisible(this, false);
              super.onPause();
            }

            private boolean backInFlight;
            private void routeSystemBack() {
              if(backInFlight || getBridge()==null || getBridge().getWebView()==null)return;
              backInFlight=true;
              try {
                getBridge().getWebView().evaluateJavascript(
                  "Boolean(window.quickSpendSystemBack && window.quickSpendSystemBack())",
                  handled -> {
                    backInFlight=false;
                    if("false".equals(handled) && !moveTaskToBack(true))finish();
                  }
                );
              } catch(RuntimeException e) { backInFlight=false; }
            }

            private void grab(Intent i) {
              if (i == null || !Intent.ACTION_SEND.equals(i.getAction())) return;
              String t = i.getStringExtra(Intent.EXTRA_TEXT);
              if (t != null && t.length() > 0) {
                SmsReceiver.push(this, "share", t, System.currentTimeMillis());
              }
              i.setAction(Intent.ACTION_MAIN);
            }
          }
