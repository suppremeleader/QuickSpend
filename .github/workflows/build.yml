              private class TetherView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  float anchorX, anchorY, endX, endY;
                  TetherView() { super(FloatingCaptureService.this); paint.setColor(ACCENT); paint.setStrokeCap(Paint.Cap.ROUND); }
                  @Override protected void onDraw(Canvas canvas) {
                      float distance = (float)Math.hypot(endX-anchorX, endY-anchorY);
                      paint.setAlpha(135); paint.setStrokeWidth(Math.max(dp(2), dp(7)-distance/50));
                      canvas.drawLine(anchorX, anchorY, endX, endY, paint);
                      paint.setAlpha(200); canvas.drawCircle(anchorX, anchorY, dp(5), paint);
                      paint.setAlpha(255); paint.setTextSize(dp(12)); paint.setTextAlign(Paint.Align.CENTER);
                      canvas.drawText(tr(distance >= dp(64) ? "Release to hide · kept in Review" : "Pull further to hide"), getWidth()/2f, getHeight()-dp(38), paint);
                  }
              }
              private void showTether(float x, float y) {
