name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir -p www && cp index.html www/
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.autosave.quickspend","appName":"Quick Spend","webDir":"www","backgroundColor":"#000000"}
          EOF
          npm install
          npm install @capacitor/local-notifications@^6.0.0
          npx cap add android
          D=android/app/src/main/java/com/autosave/quickspend
          mkdir -p $D
          cat > $D/SmsReceiver.java <<'EOF'
          package com.autosave.quickspend;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class SmsReceiver {
            static final String PREFS = "qs_sms";
            static final String KEY = "queue";
            static final String CH = "qs_pay";
            static final Pattern KW = Pattern.compile("(?i)(debited|credited|spent|paid|received|withdrawn|sent rs|sent inr|purchase|txn|transaction|transferred|refund)");
            static final Pattern BAD = Pattern.compile("(?i)(otp|one.?time|verification code|below minimum|min(imum)? (bal|limit)|payment due|amount due|due on|will be debited|request(ed)? (money|from)|collect request|fail|declin|unsuccess|not processed|offer|apply now|congratulations|pre-?approved)");
            static final Pattern AMT = Pattern.compile("(?i)(?:rs\\.?|inr|\\u20b9)\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)");

            static void push(Context c, String from, String body, long ts) {
              try {
                SharedPreferences p = c.getSharedPreferences(PREFS, 0);
                JSONArray q = new JSONArray(p.getString(KEY, "[]"));
                JSONObject o = new JSONObject();
                o.put("from", from);
                o.put("body", body);
                o.put("ts", ts);
                q.put(o);
                p.edit().putString(KEY, q.toString()).apply();
              } catch (Exception e) { }
            }

            static void alert(Context c, String body) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel(CH, "Payments", NotificationManager.IMPORTANCE_HIGH));
              }
              Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
              if (li == null) return;
              PendingIntent pi = PendingIntent.getActivity(c, 0, li, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              Matcher m = AMT.matcher(body);
              String amt = m.find() ? "\u20b9" + m.group(1) : "Payment";
              Notification n = new NotificationCompat.Builder(c, CH)
                .setSmallIcon(android.R.drawable.ic_dialog_info)
                .setContentTitle("Quick Spend: " + amt)
                .setContentText("Tap to categorise this payment")
                .setAutoCancel(true)
                .setContentIntent(pi)
                .setPriority(NotificationCompat.PRIORITY_HIGH)
                .build();
              nm.notify((int) (System.currentTimeMillis() % 100000), n);
            }
          }
          EOF
          cat > $D/NotifListener.java <<'EOF'
          package com.autosave.quickspend;

          import android.app.Notification;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.os.Parcelable;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          public class NotifListener extends NotificationListenerService {
            @Override
            public void onNotificationPosted(StatusBarNotification sbn) {
              try {
                if (sbn == null || getPackageName().equals(sbn.getPackageName())) return;
                Notification n = sbn.getNotification();
                if (n == null || n.extras == null) return;
                if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                Bundle e = n.extras;
                String title = str(e.getCharSequence(Notification.EXTRA_TITLE));
                String body = "";
                Parcelable[] ms = e.getParcelableArray(Notification.EXTRA_MESSAGES);
                if (ms != null && ms.length > 0 && ms[ms.length - 1] instanceof Bundle) {
                  body = str(((Bundle) ms[ms.length - 1]).getCharSequence("text"));
                }
                if (body.isEmpty()) body = str(e.getCharSequence(Notification.EXTRA_BIG_TEXT));
                if (body.isEmpty()) body = str(e.getCharSequence(Notification.EXTRA_TEXT));
                if (body.isEmpty()) return;
                if (!SmsReceiver.KW.matcher(body).find() || SmsReceiver.BAD.matcher(body).find() || !SmsReceiver.AMT.matcher(body).find()) return;
                SharedPreferences p = getSharedPreferences(SmsReceiver.PREFS, 0);
                String sig = Integer.toString(body.hashCode());
                long now = System.currentTimeMillis();
                if (sig.equals(p.getString("lastSig", "")) && now - p.getLong("lastTs", 0) < 120000) return;
                p.edit().putString("lastSig", sig).putLong("lastTs", now).apply();
                SmsReceiver.push(this, title, body, sbn.getPostTime());
                SmsReceiver.alert(this, body);
              } catch (Exception ex) { }
            }

            private static String str(CharSequence c) {
              return c == null ? "" : c.toString();
            }
          }
          EOF
          cat > $D/SmsBridgePlugin.java <<'EOF'
          package com.autosave.quickspend;

          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
            name = "SmsBridge",
            permissions = {
              @Permission(strings = {"android.permission.POST_NOTIFICATIONS"}, alias = "notif")
            }
          )
          public class SmsBridgePlugin extends Plugin {
            @PluginMethod
            public void status(PluginCall call) {
              JSObject r = new JSObject();
              boolean on = NotificationManagerCompat.getEnabledListenerPackages(getContext()).contains(getContext().getPackageName());
              r.put("listener", on);
              r.put("notif", Build.VERSION.SDK_INT < 33 || getPermissionState("notif") == PermissionState.GRANTED);
              call.resolve(r);
            }

            @PluginMethod
            public void requestNotif(PluginCall call) {
              requestPermissionForAlias("notif", call, "done");
            }

            @PermissionCallback
            private void done(PluginCall call) {
              status(call);
            }

            @PluginMethod
            public void openListener(PluginCall call) {
              try {
                Intent i;
                if (Build.VERSION.SDK_INT >= 30) {
                  i = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_DETAIL_SETTINGS);
                  i.putExtra(Settings.EXTRA_NOTIFICATION_LISTENER_COMPONENT_NAME, new ComponentName(getContext(), NotifListener.class).flattenToString());
                } else {
                  i = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                }
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception e) {
                Intent j = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                j.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(j);
              }
              call.resolve();
            }

            @PluginMethod
            public void drain(PluginCall call) {
              SharedPreferences p = getContext().getSharedPreferences(SmsReceiver.PREFS, 0);
              String q = p.getString(SmsReceiver.KEY, "[]");
              p.edit().putString(SmsReceiver.KEY, "[]").apply();
              JSObject r = new JSObject();
              try {
                r.put("items", new JSArray(q));
              } catch (Exception e) {
                r.put("items", new JSArray());
              }
              call.resolve(r);
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.autosave.quickspend;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SmsBridgePlugin.class);
              super.onCreate(savedInstanceState);
              grab(getIntent());
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              grab(intent);
            }

            private void grab(Intent i) {
              if (i == null || !Intent.ACTION_SEND.equals(i.getAction())) return;
              String t = i.getStringExtra(Intent.EXTRA_TEXT);
              if (t != null && t.length() > 0) {
                SmsReceiver.push(this, "share", t, System.currentTimeMillis());
              }
              i.setAction(Intent.ACTION_MAIN);
            }
          }
          EOF
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
          svc = '<service android:name=".NotifListener" android:label="Quick Spend" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service>\n'
          share = '<intent-filter><action android:name="android.intent.action.SEND"/><category android:name="android.intent.category.DEFAULT"/><data android:mimeType="text/plain"/></intent-filter>\n'
          if 'NotifListener' not in s:
              s = s.replace('<application', perms + '<application', 1).replace('</activity>', share + '</activity>', 1).replace('</application>', svc + '</application>', 1)
          open(p, 'w').write(s)
          PY
          grep -q NotifListener android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml
          grep -q SmsBridgePlugin $D/MainActivity.java
          echo "MANIFEST CHECK OK"
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt 2>/dev/null | tail -1)
          if [ -n "$AAPT" ]; then $AAPT dump permissions $APK || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: quickspend-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
