<script>
const captureSurface=typeof window.QuickCapture?.postMessage==='function';
let captureRequest=0;
const captureReplies=new Map();
if(captureSurface){
 document.documentElement.classList.add('capture-surface');
 window.QuickCapture.onmessage=event=>{
  const reply=JSON.parse(event.data),done=captureReplies.get(reply.id);
  if(!done)return;
  captureReplies.delete(reply.id);
  if(reply.error)done.reject(Error(reply.error));else done.resolve(reply)
 }
}
function callCapture(action,data={}){
 return new Promise((resolve,reject)=>{
  const id=++captureRequest;
  captureReplies.set(id,{resolve,reject});
  window.QuickCapture.postMessage(JSON.stringify({id,action,...data}))

let language=(()=>{try{return localStorage.getItem('qs_language')==='hi'?'hi':'en'}catch(e){return 'en'}})();
function L(value){return language==='hi'&&(Object.prototype.hasOwnProperty.call(HI,value))?HI[value]:value;}
function displayDate(value,ts){if(ts){const date=new Date(ts);return date.getDate()+' '+L(MN[date.getMonth()])}return L(value);}
function accountLabel(value){return ['All','Main account','Cash'].includes(value)?L(value):value;}
const COLOR_MODES={
 dark:{name:'Dark',description:'Default appearance',background:'#09090c',scheme:'dark'},
 matte:{name:'Matte dark',description:'Flat charcoal surfaces',background:'#151618',scheme:'dark'},
 light:{name:'Light',description:'A brighter look',background:'#ededed',scheme:'light'},
 aurora:{name:'Aurora',description:'Soft violet, blue and coral',background:'#f1edf6',scheme:'light'}
};
function validColorMode(mode){return Object.prototype.hasOwnProperty.call(COLOR_MODES,mode)}
let colorMode='dark',categoryPickerEnabled=false;
try{
 const mode=localStorage.getItem('qs_color_mode');
 if(validColorMode(mode))colorMode=mode;
 categoryPickerEnabled=localStorage.getItem('qs_category_picker')==='1'
}catch(e){}
function applyColorMode(){
 const theme=COLOR_MODES[colorMode];
 document.documentElement.setAttribute('data-theme',colorMode);
 document.documentElement.style.colorScheme=theme.scheme;
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',theme.background)
}
async function setColorMode(mode){if(!validColorMode(mode))return;try{localStorage.setItem('qs_color_mode',mode)}catch(e){alert(L('Could not save. Try again.'));return}colorMode=mode;applyColorMode();try{const P=SB();if(P)await P.setColorMode({mode})}catch(e){console.warn('Color mode:',e.message||e)}render();openColorMode()}
function openColorMode(){$('#sheet').innerHTML=`<div class="grab"></div><div class="sheet-heading"><h2>${L('Color mode')}</h2><button class="icon-btn" aria-label="${L('Close')}" onclick="openData()">×</button></div><div class="color-options" role="group" aria-label="${L('Color mode')}">${Object.entries(COLOR_MODES).map(([mode,theme])=>`<button class="color-choice ${colorMode===mode?'selected':''}" aria-pressed="${colorMode===mode}" onclick="setColorMode('${mode}')"><span class="theme-swatch ${mode}"><i></i><i></i><i></i></span><b>${L(theme.name)}</b><small>${L(theme.description)}</small><span class="theme-check">${colorMode===mode?'✓':''}</span></button>`).join('')}</div>`;openSheetHistory();$('#dim').classList.add('on');$('#sheet').classList.add('on')}
applyColorMode();
async function toggleCategoryPicker(){
 const next=!categoryPickerEnabled,P=SB();
 try{
  if(P)await P.setCategoryPicker({enabled:next});
  localStorage.setItem('qs_category_picker',next?'1':'0');
  categoryPickerEnabled=next;openData()
 }catch(e){alert(L('Could not save. Try again.'))}
}
let entryCategoryTab=null;
function openEntryCategory(tab='general'){entryCategoryTab=tab;paintEntryCategory();$('#sheet').scrollTop=0}
function closeEntryCategory(){entryCategoryTab=null;adding=null;paint();$('#sheet').scrollTop=0}
function paintEntryCategory(){
 const custom=new Set(customCats[cur.type]);
 const rows=entryCategories().map((row,index)=>({name:row[1],index})).filter(row=>custom.has(row.name)===(entryCategoryTab==='custom'));

function mergeCustomCategories(data){let changed=false;if(!data||typeof data!=='object')return false;for(const type of Object.keys(customCats)){for(const raw of Array.isArray(data[type])?data[type]:[]){if(!validCategory(raw))continue;const name=raw.trim();if(CATS[type].some(x=>x[1].toLowerCase()===name.toLowerCase()))continue;CATS[type].push(['🏷️',name]);customCats[type].push(name);ICON[name]='🏷️';if(type==='Expense'&&!BUDGET_CATS.includes(name))BUDGET_CATS.push(name);changed=true}}return changed}
function categorySnapshot(){return Object.fromEntries(Object.entries(customCats).map(([type,names])=>[type,[...names]]))}
function restoreCategories(snapshot){for(const type of Object.keys(customCats)){const removed=new Set(customCats[type]);CATS[type]=CATS[type].filter(x=>!removed.has(x[1]));}BUDGET_CATS.splice(0,BUDGET_CATS.length,...['Food','Travel','Shopping','Bills','Health','Fun','Other','Uncategorised','Savings']);customCats={Expense:[],Income:[],Lent:[],Borrowed:[]};mergeCustomCategories(snapshot)}
function categoryScores(){const scores={};for(const type of Object.keys(CATS)){scores[type]={};for(const x of monthTransactions(new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')).filter(x=>x.t===type)){const score=scores[type][x.c]||[0,0];scores[type][x.c]=[score[0]+x.a,score[1]+1]}}return scores}
function rankedCategories(type){const scores=categoryScores()[type]||{};return CATS[type].map((c,i)=>({c,i})).sort((a,b)=>(scores[b.c[1]]?.[0]||0)-(scores[a.c[1]]?.[0]||0)||(scores[b.c[1]]?.[1]||0)-(scores[a.c[1]]?.[1]||0)||a.i-b.i).map(x=>x.c)}
function entryCategories(){if(!cur.categoryOrder)cur.categoryOrder={};if(!cur.categoryOrder[cur.type])cur.categoryOrder[cur.type]=rankedCategories(cur.type).map(c=>c[1]);return cur.categoryOrder[cur.type].map(name=>CATS[cur.type].find(c=>c[1]===name)).filter(Boolean)}

let subscriptions=[],savingsRecords=[],planningDeleted={},planningDraft=null,planningReturn=null,planningNativeError='',planningLastPayload='',planningTimer=null,planningSyncing=false,planningSyncAgain=false,planningActionBusy=false;

function planningId(){return 'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)}

function validPlanningDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!!planDate(s)&&s>='2000-01-01'&&s<='2199-12-31'}
function cleanPlanning(rows,kind){const seen=new Set();return(Array.isArray(rows)?rows:[]).filter(x=>x&&typeof x.id==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(x.id)&&!seen.has(x.id)&&seen.add(x.id)).map(x=>{const name=String(x.name||'').trim().slice(0,80),cents=Number(x.cents),updatedAt=Number(x.updatedAt);if(!name||!Number.isSafeInteger(cents)||cents<=0||cents>1e12||!Number.isSafeInteger(updatedAt)||updatedAt<0)return null;const r={id:x.id,name,cents,notes:String(x.notes||'').slice(0,300),updatedAt};if(kind==='sub'){if(![1,3,12].includes(x.interval)||!validPlanningDate(x.date)||!['active','paused','cancelled'].includes(x.status)||![-1,1,3,7].includes(x.reminder))return null;Object.assign(r,{interval:x.interval,date:x.date,status:x.status,reminder:x.reminder})}return r}).filter(Boolean)}
function mergePlanning(data){for(const[k,v]of Object.entries(data.planningDeleted||{})){if(/^(sub|sav):[a-zA-Z0-9_-]{1,80}$/.test(k)&&Number.isSafeInteger(v)&&v>=0)planningDeleted[k]=Math.max(planningDeleted[k]||0,v)}for(const[key,kind]of [['subscriptions','sub'],['savingsRecords','sav']]){const current=key==='subscriptions'?subscriptions:savingsRecords,map=new Map(current.map(x=>[x.id,x]));for(const x of cleanPlanning(data[key],kind)){const old=map.get(x.id);if(!old||x.updatedAt>old.updatedAt)map.set(x.id,x)}const list=[...map.values()].filter(x=>!(planningDeleted[kind+':'+x.id]>=x.updatedAt));if(key==='subscriptions')subscriptions=list;else savingsRecords=list}}

function planDate(value){const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));if(!match)return null;const [year,month,day]=match.slice(1).map(Number);if(year<1900||year>9999)return null;const date=new Date(year,month-1,day);return date.getFullYear()===year&&date.getMonth()===month-1&&date.getDate()===day?{year,month:month-1,day,index:year*12+month-1}:null}

 const paid=new Map();
 for(const entry of linkedEmiPayments(r)){
  const date=new Date(Number(entry.ts)),amount=Math.round(Number(entry.a)*100);
  if(!Number.isFinite(date.getTime())||!Number.isSafeInteger(amount)||amount<=0)continue;
  const key=date.getFullYear()*12+date.getMonth();paid.set(key,(paid.get(key)||0)+amount)

function bindReviewSwipe(){
 const screen=$('#s-review');
 let gesture=null,suppressClick=false;
 const shift=(row,x)=>{
  row.dataset.side=x>0?'left':'right';
  row.style.setProperty('--review-shift',x+'px')
 };
 screen.addEventListener('pointerdown',event=>{
  suppressClick=false;
  const row=event.target.closest('.review-swipe');
  screen.querySelectorAll('.review-swipe[data-open]').forEach(open=>{
   if(open!==row){shift(open,0);delete open.dataset.open}
  });
  if(event.button!==0||!row||!event.target.closest('.review-payment'))return;
  gesture={row,id:event.pointerId,x:event.clientX,y:event.clientY,dragging:false}
 });
 screen.addEventListener('pointermove',event=>{
  if(!gesture||gesture.id!==event.pointerId)return;
  const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y,row=gesture.row;
  if(!gesture.dragging){
   if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)){gesture=null;return}
   if(Math.abs(dx)<10)return;
   gesture.dragging=true;row.classList.add('dragging');row.setPointerCapture?.(event.pointerId)
  }
  shift(row,Math.max(-72,Math.min(72,dx)))
 });
 const finish=(event,cancelled)=>{
  if(!gesture||gesture.id!==event.pointerId)return;
  const {row,x,dragging}=gesture;
  gesture=null;
  if(!dragging)return;
  const dx=event.clientX-x,open=!cancelled&&Math.abs(dx)>=52;
  row.classList.remove('dragging');
  shift(row,open?Math.sign(dx)*72:0);
  if(open)row.dataset.open='';else delete row.dataset.open;
  suppressClick=!cancelled
 };
 screen.addEventListener('pointerup',event=>finish(event,false));
 screen.addEventListener('pointercancel',event=>finish(event,true));
 screen.addEventListener('lostpointercapture',event=>finish(event,true));
 screen.addEventListener('click',event=>{
  if(!suppressClick||event.detail===0)return;
  suppressClick=false;event.stopPropagation();event.preventDefault()
 },true)
}

 const finish=(event,cancelled)=>{if(!drag||drag.id!==event.pointerId)return;const state=drag;drag=null;try{sheet.releasePointerCapture(event.pointerId)}catch(e){}sheet.style.transition='';if(!cancelled&&dismissSheetGesture(state.dy,event.timeStamp-state.time))closeSheet();else sheet.style.transform=''};
 sheet.addEventListener('pointerup',event=>finish(event,false));sheet.addEventListener('pointercancel',event=>finish(event,true));
 document.addEventListener('pointerdown',event=>{if(sheet.classList.contains('on')&&!sheet.contains(event.target)&&!$('#language-choice').classList.contains('on')){event.preventDefault();closeSheet()}},true);
 document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(inAppQuickGesture?.categories)cancelInAppQuickAccess();else if(sheet.classList.contains('on'))closeSheet()}});
}
installSheetGestures();

if(!captureSurface){
render();
initialiseLanguage();
initialiseAccount();
initialiseUpdates();
setTimeout(()=>{syncPlanningNative(true);takePlanningAction()},600);
}
</script></body></html>
