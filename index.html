ave. In the web version, use Test quick capture to try it.":"बैंक के SMS से राशि अपने आप भर जाती है। अलर्ट खोलें, श्रेणी चुनें और सेव करें। वेब संस्करण में इसे आज़माने के लिए क्विक कैप्चर टेस्ट करें।","Everything in one place":"सारा हिसाब एक जगह","Expenses, income, money you lent or borrowed (with a speed dial for friends), several accounts, and recurring payments or EMIs.":"खर्च, आमदनी, दिया या लिया गया उधार, अलग-अलग खाते और नियमित भुगतान या किस्तें—सब एक जगह।","Your data stays with you":"आपका डेटा आपके पास रहता है","Your records stay on this device. Back up anytime from ⚙️ on Home. Web and Android records are saved separately.":"आपका हिसाब इसी डिवाइस पर रहता है। होम पर ⚙️ से कभी भी बैकअप लें। वेब और Android के रिकॉर्ड अलग सेव होते हैं।","Allow notifications":"सूचनाओं की अनुमति दें","When a bank payment is detected, Quick Spend shows a small alert you can tap. Press Allow, then choose Allow in the Android popup.":"बैंक का भुगतान मिलते ही QuickSpend एक सूचना दिखाता है। अनुमति दें दबाएँ, फिर Android के पॉपअप में अनुमति दें।","Allow SMS access":"SMS की अनुमति दें","This lets the app read bank SMS on your phone so payments are caught automatically. Nothing leaves your phone. Press Allow, then choose Allow in the popup.":"इससे ऐप बैंक के SMS पढ़कर भुगतान पहचान सकता है। SMS फ़ोन से बाहर नहीं जाते। अनुमति दें दबाएँ, फिर पॉपअप में अनुमति दें।","Quick capture over other apps":"दूसरे ऐप्स के ऊपर क्विक कैप्चर","Allow QuickSpend to display over other apps. Once allowed, quick capture starts automatically whenever you open QuickSpend. A shortcut appears for bank payments. You can turn it off in Settings.":"QuickSpend को दूसरे ऐप्स के ऊपर दिखने की अनुमति दें। इसके बाद ऐप खोलने पर क्विक कैप्चर अपने आप चालू होगा। बैंक के भुगतान पर शॉर्टकट दिखेगा। इसे सेटिंग्स से बंद कर सकते हैं।","Skip":"छोड़ें","Allow":"अनुमति दें","Next":"आगे","Get started":"शुरू करें","Not now":"अभी नहीं","Checking…":"जाँच हो रही है…","Open notification settings":"सूचना सेटिंग्स खोलें","Paste a bank SMS":"बैंक function openLanguageChoice(){const screen=$('#language-choice');screen.innerHTML=`<div class="onb-header">${ftueBrand()}</div><div class="onb-panel"><div class="ftue-kicker">${L('Made for your everyday money')}</div><h1>अपनी भाषा चुनें</h1><p class="od">${L("Choose your language")}</p><div class="language-options"><button lang="hi" onclick="chooseLanguage('hi')"><span>हिन्दी<small>Hindi</small></span><span aria-hidden="true">↗</span></button><button lang="en" onclick="chooseLanguage('en')"><span>English<small>अंग्रेज़ी</small></span><span aria-hidden="true">↗</span></button></div></div><div class="onb-actions"><p class="hint" id="language-result">आप इसे बाद में सेटिंग्स से बदल सकते हैं।<br>${L("You can change this later in Settings.")}</p></div>`;screen.classList.add('on');screen.setAttribute('role','dialog');screen.setAttribute('aria-modal','true');screen.setAttribute('aria-label','Choose your language / अपनी भाषा चुनें');}
async function chooseLanguage(next){if(!['hi','en'].includes(next))return;try{const P=SB();if(P)await P.setLanguage({language:next});localStorage.setItem('qs_language',next);language=next;$('#language-choice').classList.remove('on');closeSheet();languageChrome();render();if($('#account-setup').classList.contains('on'))openAccount(true);if($('#onb').classList.contains('on'))showOb()}catch(e){$('#language-result').textContent=L('Could not change language. Please try again.');}}

const CATS={Expense:[['🍔','Food'],['🚕','Travel'],['🛍️','Shopping'],['🧾','Bills'],['🎬','Fun'],['💊','Health'],['✨','Other']],
Income:[['💼','Salary'],['🎁','Gift'],['↩️','Refund'],['✨','Other']],Lent:[['🤝','Friend'],['👪','Family']],Borrowed:[['🤝','Friend'],['👪','Family']]};
Object.values(CATS).forEach(categories=>categories.unshift(['◌','Uncategorised']));
const ICON={};Object.values(CATS).flat().forEach(c=>ICON[c[1]]=c[0]);
let customCats={Expense:[],Income:[],Lent:[],Borrowed:[]},nativeCatalogBusy=false;
function validCategory(value){return typeof value==='string'&&value.trim().length>0&&value.trim().length<=40&&!/[<>"'\u0000-\u001f]/.test(value)&&!['__proto__','constructor','prototype','Savings'].includes(value.trim())}
function mergeCustomCategories(data){let changed=false;if(!data||typeof data!=='object')return false;for(const type of Object.keys(customCats)){for(const raw of Array.isArray(data[type])?data[type]:[]){if(!validCategory(raw))continue;const name=raw.trim();if(CATS[type].some(x=>x[1].toLowerCase()===name.toLowerCase()))continue;CATS[type].push(['🏷️',name]);customCats[type].push(name);ICON[name]='🏷️';if(type==='Expense'&&!BUDGET_CATS.includes(name))BUDGET_CATS.push(name);changed=true}}return changed}
function categorySnapshot(){return Object.fromEntries(Object.entries(customCats).map(([type,names])=>[type,[...names]]))}
function restoreCategories(snapshot){for(const type of Object.keys(customCats)){const removed=new Set(customCats[type]);CATS[type]=CATS[type].filter(x=>!removed.has(x[1]));}BUDGET_CATS.splice(0,BUDGET_CATS.length,...['Food','Travel','Shopping','Bills','Health','Fun','Other','Uncategorised','Savings']);customCats={Expense:[],Income:[],Lent:[],Borrowed:[]};mergeCustomCategories(snapshot)}
function categoryScores(){const scores={};for(const type of Object.keys(CATS)){scores[type]={};for(const x of monthTransactions(new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')).filter(x=>x.t===type)){const score=scores[type][x.c]||[0,0];scores[type][x.c]=[score[0]+x.a,score[1]+1]}}return scores}
function rankedCategories(type){const scores=categoryScores()[type]||{};return CATS[type].map((c,i)=>({c,i})).sort((a,b)=>(scores[b.c[1]]?.[0]||0)-(scores[a.c[1]]?.[0]||0)||(scores[b.c[1]]?.[1]||0)-(scores[a.c[1]]?.[1]||0)||a.i-b.i).map(x=>x.c)}

function SB(n='SmsBridge'){
 const cap=window.Capacitor;
 if(!cap||typeof cap.isNativePlatform!=='function'||!cap.isNativePlatform())return null;
 // SmsBridge always uses the native promise transport. An injected legacy
 // object can be present while lacking methods added in a later app release.
 const existing=cap.Plugins&&cap.Plugins[n];
 if(n!=='SmsBridge'&&existing)return existing;
 const methods=n==='SmsBridge'?['status','request','requestSms','requestNotif','drain','inboxSnapshot','syncCaptureCatalog','openNotificationSettings','openCaptureNotificationSettings','testNotification','overlayStatus','quickAccessSettings','setQuickAccessSettings','openOverlaySettings','setOverlayEnabled','setLanguage','setColorMode','testOverlay','acknowledgeSaved','completeSms','clearNativeInbox']:n==='UpdateBridge'?['status','setAlerts','check','dismiss','start','complete','openStore']:n==='AccountBridge'?['status','signIn','signOut','download','upload']:n==='Share'?['share']:[];
 const plugin={};
 for(const method of methods)plugin[method]=(options={})=>{
  if(typeof cap.nativePromise==='function')return cap.nativePromise(n,method,options);
  if(existing&&typeof existing[method]==='function')return existing[method](options);

function parseSms(from,body){const t=(body||'').replace(/\s+/g,' ').trim();
 if(!/(debited|credited|spent|paid|received|withdrawn|sent rs|sent inr|purchase|txn|transaction|transferred|refund)/i.test(t))return null;
 if(/(otp|one.?time|verification code|below minimum|min(imum)? (bal|limit)|payment due|amount due|due on|will be debited|request(ed)? (money|from)|collect request|fail|declin|unsuccess|not processed|offer|apply now|congratulations|pre-?approved)/i.test(t))return null;
 const re=/(?:rs\.?|inr|₹)\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)/gi;let m,a=null,x;
 while((m=re.exec(t))){if(!/(bal|limit|lmt|avl|available|outstanding|due)[^0-9]{0,12}$/i.test(t.slice(Math.max(0,m.index-18),m.index))){a=parseFloat(m[1].replace(/,/g,''));break}}
 if(!a&&(x=t.match(/(?:debited|credited)\s+(?:by|for|with)?\s*(?:rs\.?|inr)?\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i)))a=parseFloat(x[1].replace(/,/g,''));
 if(!a)return null;
 const d=t.search(/debited|spent|paid|withdrawn|sent|purchase|transferred|payment of|txn of/i),c=t.search(/credited|received|deposited|refund/i),kind=d<0?'Income':c<0?'Expense':(d<c?'Expense':'Income');
 const bk=BANKS.find(b=>b[0].test(from+' '+t)),bank=bk?bk[1]:'',l4=(x=t.match(/(?:\ba\/c|\bacct?|\bac|\baccount|\bcard)(?:\s*(?:no\.?|number))?\s*(?:ending|xx+|x+|\*+)?\s*([0-9]{3,4})\b/i))?x[1]:'';
 const stop='(?=\\s+(?:on|ref|via|upi|using|from|to|dt|date|avl|bal|not|if|call|\\d{2}[-/])|[.,;(]|$)';
 let mer=null;
 if(x=t.match(new RegExp('VPA\\s+\\S+@\\S+\\s+([A-Za-z][A-Za-z0-9 &._-]{1,28}?)'+stop,'i')))mer=x[1];
 else if(x=t.match(/;\s*([A-Za-z][A-Za-z0-9 &._-]{1,25}?)\s+(?:credited|debited)/i))mer=x[1];
 else if(x=t.match(/\d{2}:\d{2}:\d{2}\s+(?!(?:avl|bal|not|if)\b)([A-Za-z0-9][A-Za-z0-9 &._*-]{1,25}?)\s+(?:avl|bal|not|if)\b/i))mer=x[1];
 else if(x=t.match(new RegExp(kind==='Expense'?'(?:\\bat|\\bto|trf to|towards)\\s+(?!a/c|ac\\b|acct|your|the\\b|vpa|you\\b)([A-Za-z0-9@][A-Za-z0-9@ &._*-]{1,28}?)'+stop:'(?:\\bfrom|\\bby)\\s+(?!a/c|ac\\b|acct|your|the\\b|rs|inr|\\d)(?:vpa\\s+)?([A-Za-z0-9@][A-Za-z0-9@ &._*-]{1,28}?)'+stop,'i')))mer=x[1];
 if(mer){mer=mer.split('@')[0].replace(/[._*-]+/g,' ').trim();if(/^[A-Z0-9 &]+$/.test(mer)||/^[a-z0-9 ]+$/.test(mer))mer=mer.toLowerCase().replace(/\b\w/g,z=>z.toUpperCase());mer=mer.slice(0,24)}
 return{m:mer||(bank?bank+' payment':'Bank payment'),a,kind,acc:bank?(l4?bank+' '+l4:bank):null}}
function openPaste(){$('#sheet').innerHTML=`<div class="grab"></div><div class="mer">${L("Paste a bank SMS")}</div><textarea class="fld" id="pt2" rows="5" style="margin-top:12px" placeholder="${L("Paste the message here")}"></textarea><div class="hint" id="pm">${L("In Messages: long-press the SMS, tap Copy, then paste it here. Or tap Share and pick Quick Spend.")}</div><div class="acts"><button class="later" onclick="closeSheet()">${L("Cancel")}</button><button class="save" onclick="addPasted()">${L("Add")}</button></div>`;openSheetHistory();$('#dim').classList.add('on');$('#sheet').classList.add('on')}

async function reqPerm(w){const P=SB();if(!P)return 'web';try{if(w==='overlay'){const s=await P.overlayStatus();if(!s.allowed){localStorage.setItem('qs_overlay_waiting','1');localStorage.setItem('qs_overlay_prompted','1');await P.openOverlaySettings();return 'settings'}await P.setOverlayEnabled({enabled:true});localStorage.removeItem('qs_overlay_waiting');return 'granted'}const r=await (w==='notif'?P.requestNotif():P.requestSms());return r[w]?'granted':'denied'}catch(e){return 'error: '+(e&&e.message||e)}}
async function permStep(a){const start=ob,button=$('#onb .obtn');if(button.disabled)return;button.disabled=true;button.textContent=L('Checking…');const result=await reqPerm(a);if(ob!==start||!$('#onb').classList.contains('on'))return;button.disabled=false;button.textContent=L('Allow');if(result==='granted'||result==='web'){obNext();return}let el=document.getElementById('perm-result');if(!el){el=document.createElement('p');el.id='perm-result';el.className='hint';el.setAttribute('role','status');$('#onb-actions').appendChild(el)}el.textContent=L(result==='settings'?'Switch on Allow display over other apps for QuickSpend, then return. Quick capture starts automatically.':result.startsWith('error:')?result:'Permission was not granted. You can retry or choose Not now.');if(a==='notif'&&!document.getElementById('perm-settings')){const settings=document.createElement('button');settings.id='perm-settings';settings.className='onb-settings';settings.textContent=L('Open notification settings');settings.onclick=notificationSettings;$('#onb-actions').appendChild(settings)}}

let pullingNative=false;
function paintReviewStatus(){const el=$('#review-sync');if(el)el.textContent=reviewSyncError?(language==='hi'?'भुगतान सिंक नहीं हुए: ':'Could not sync payments: ')+L(reviewSyncError):SB()?(reviewSyncAt?(language==='hi'?'भुगतान सिंक हुए · '+pending.length+' बाकी':'Payments synced · '+pending.length+' waiting'):L('Checking payment inbox…')):L('Payments are saved in this browser');}
const cleanNativeText=value=>String(value||'').replace(/[<>"']/g,'').trim().slice(0,60);
async function pull(fg){const P=SB();if(!P||pullingNative)return;pullingNative=true;try{
 let response;
 try{response=await P.inboxSnapshot()}catch(e){response=await P.drain()}
 const r=typeof response.payload==='string'?JSON.parse(response.payload):response,ack=[],completed=[];if(r.customCategories)mergeCustomCategories(r.customCategories);
 for(const field of ['items','entries']){if(typeof r[field]==='string')r[field]=JSON.parse(r[field]);if(!Array.isArray(r[field]))throw new Error('Payment inbox returned invalid '+field+'. Update QuickSpend and retry.');}
 let last=null,n=0,changed=false;
 for(const entry of r.entries||[]){
  const key=String(entry.nativeKey||entry.sourceKey||'');if(!key)continue;if(deletedSource(key)){ack.push(key);continue;}
  if(!tx.some(x=>x.nativeKey===key||x.sourceKey===key)){
   const t=['Expense','Income','Lent','Borrowed'].includes(entry.t)?entry.t:'Expense',a=Number(entry.a),ts=Number(entry.ts)||Date.now();
   if(!Number.isFinite(a)||a<=0)continue;
   const parsed=parseSms(entry.smsFrom||'',entry.smsBody||''),acc=cleanNativeText(entry.acc||(parsed&&parsed.acc)||accts[0].n);
   if(!accts.some(x=>x.n===acc))accts.push({n:acc,i:'🏦'});
   const who=t==='Lent'||t==='Borrowed'?cleanNativeText(entry.who)||'Friend':null;
   if(who&&!speed.includes(who))speed.push(who);
   const category=CATS[t].some(x=>x[1]===entry.c)?entry.c:CATS[t][0][1];
   tx.push({id:++sid,t,a,note:String(entry.note||'').trim().slice(0,300),c:category,m:who||cleanNativeText((parsed&&parsed.m)||entry.m)||'Bank payment',who,settled:0,ts,d:fd(ts),acc,nativeKey:key,sourceKey:key});
   changed=true;
  }
  const before=pending.length;pending=pending.filter(x=>x.sourceKey!==key);if(before!==pending.length)changed=true;if(cur.sourceKey===key)closeSheet();ack.push(key);
 }
 for(const o of r.items||[]){
  if(o.demo)continue;
  const key=o.sourceKey||o.ts+'|'+(o.body||'').slice(0,50);
  if(deletedSource(key)||tx.some(x=>x.sourceKey===key)){completed.push(key);continue;}
  if(pending.some(x=>x.sourceKey===key))continue;
  const p=parseSms(o.from||'',o.body||'')||(Number(o.amount)>0?{m:cleanNativeText(o.merchant)||'Bank payment',a:Number(o.amount),kind:o.kind==='Income'?'Income':'Expense',acc:null}:null);
  // Keep unrecognised payments available for manual review; never discard them.
  const payment=p||{m:'Bank payment · check amount',a:'',kind:'Expense',acc:null};
  smsSeen.push(key);
  if(payment.acc&&!accts.some(b=>b.n===payment.acc))accts.push({n:payment.acc,i:'🏦'});
  const it={id:++sid,m:payment.m,a:payment.a,d:fd(o.ts),ts:o.ts,kind:payment.kind,acc:payment.acc,sourceKey:key};pending.push(it);last=it;n++;changed=true;
 }
 smsSeen=smsSeen.slice(-1000);
 if(changed||ack.length)render();
 if(!persist())throw new Error('Payments remain safely in the native inbox because app storage could not be written.');
 if(ack.length)await P.acknowledgeSaved({keys:ack});
 for(const sourceKey of completed)await P.completeSms({sourceKey});
 reviewSyncError='';reviewSyncAt=Date.now();paintReviewStatus();
 if(n){if(fg){inc=last;$('#bub').classList.add('show')}else if(!$('#onb').classList.contains('on'))openSheet(last)}
}catch(e){reviewSyncError=e&&e.message||String(e);paintReviewStatus();console.warn('QuickSpend native inbox:',reviewSyncError)}finally{pullingNative=false}}
async function showNativeBuild(){const el=$('#native-build');if(!el)return;const P=SB();if(!P){el.textContent='Web version · floating-capture-11';return}try{const s=await P.status();el.textContent=L(s.nativeBuild?(language==='hi'?'Android संस्करण ':'Android build ')+s.nativeBuild+' · '+(s.bridgeRevision||'unknown bridge'):'Older native build · update through your Google Play tester link')}catch(e){el.textContent='Could not read native build: '+(e.message||e)}}

let quickDraft=null,quickType='Expense',quickSaving=false;
async function openQuickAccessSettings(){const P=SB();$('#sheet').innerHTML=`<div class="grab"></div><div class="sheet-heading"><div><div class="eyebrow">${L('Experimental')}</div><h2>${L('Quick Access')}</h2></div><button class="icon-btn" aria-label="${L('Close')}" onclick="openData()">×</button></div><p class="hint" id="quick-result" role="status">${L('Checking…')}</p>`;openSheetHistory();$('#dim').classList.add('on');$('#sheet').classList.add('on');if(!P){$('#quick-result').textContent=L('Quick Access is available in the Android app.');return}try{await syncNativeCatalog();const r=await P.quickAccessSettings();const data=typeof r.payload==='string'?JSON.parse(r.payload):r;if(!Array.isArray(data.Expense)||!Array.isArray(data.Income)||data.Expense.length!==4||data.Income.length!==4)throw Error(L('Could not load Quick Access.'));quickDraft=data;quickType='Expense';paintQuickAccessSettings()}catch(e){$('#quick-result').textContent=e.message||String(e)}}
function paintQuickAccessSettings(){if(!quickDraft)return;const categories=quickType==='Income'?quickDraft.incomeCategories:quickDraft.expenseCategories,edges=['Top','Right','Bottom','Left'],arrows=['↑','→','↓','←'];$('#sheet').innerHTML=`<div class="grab"></div><div class="sheet-heading"><div><div class="eyebrow">${L('Experimental')}</div><h2>${L('Quick Access')}</h2></div><button class="icon-btn" aria-label="${L('Close')}" onclick="openData()">×</button></div><div class="quick-intro"><b>${L('Hold. Pull. Release.')}</b><p>${L('Hold the bubble, then pull away from the category you want. Release to launch into the highlighted category. A short pull cancels. Drag without holding to the bottom close target to keep the payment in Review.')}</p><button class="primary-wide" aria-pressed="${!!quickDraft.enabled}" onclick="saveQuickAccessSettings(${!quickDraft.enabled})">${L(quickDraft.enabled?'Turn off Quick Access':'Turn on Quick Access')}</button><small>${L('Off by default. A tap still opens quick capture.')}</small></div><div class="period-switch quick-type">${['Expense','Income'].map(type=>`<button class="${quickType===type?'on':''}" onclick="quickType='${type}';paintQuickAccessSettings()">${L(type)}</button>`).join('')}</div><p class="hint">${L('Income keeps its own categories and is never saved as an expense.')}</p><div class="quick-slot-list">${edges.map((edge,index)=>`<label class="quick-slot quick-slot-${index}"><span>${arrows[index]}</span><b>${L(edge)}</b><select aria-label="${L(edge)} ${L('Categories')}" onchange="quickDraft[quickType][${index}]=this.value">${(categories||[]).map(name=>`<option value="${escapeAccount(name)}" ${name===quickDraft[quickType][index]?'selected':''}>${escapeAccount(L(name))}</option>`).join('')}</select></label>`).join('')}</div><button class="primary-wide" onclick="saveQuickAccessSettings(quickDraft.enabled)">${L('Save shortcuts')}</button><p class="hint" id="quick-result" role="status"></p><button class="primary-wide" style="margin-top:10px;background:var(--card2);color:var(--tx)" onclick="openFloatingSettings()">${L('Floating quick capture')} ↗</button><p class="hint">${L('If saving fails, the payment stays in Review. Quick Access does not appear on the lock screen.')}</p>`}
async function saveQuickAccessSettings(enabled){const P=SB();if(!P||!quickDraft||quickSaving)return;quickSaving=true;try{const data={enabled:!!enabled,Expense:[...quickDraft.Expense],Income:[...quickDraft.Income]};await P.setQuickAccessSettings({payload:JSON.stringify(data)});quickDraft.enabled=data.enabled;paintQuickAccessSettings();$('#quick-result').textContent=L(data.enabled?'Quick Access is on. Hold a payment bubble to try it.':'Quick Access is off.')}catch(e){$('#quick-result').textContent=e.message||String(e)}finally{quickSaving=false}}
function openFloatingSettings(){$('#sheet').innerHTML=`<div class="grab"></div><div class="sheet-heading"><h2>${L('Floating quick capture')}</h2><button class="icon-btn" aria-label="${L('Close')}" onclick="openData()">×</button></div><p class="sub" style="line-height:1.6">${L('Capture payments over other apps')}</p><div class="settings-group" style="padding:20px"><p class="hint" id="float-status" role="status">${L('Checking…')}</p><button class="primary-wide" id="float-toggle" onclick="toggleFloatingSetting()">${L('Allow floating shortcut')}</button></div><button class="account-action account-secondary" onclick="manageCaptureNotification()">${L('Status notification')}</button><p class="hint" style="line-height:1.7">${L('Android requires this low-priority notification while floating capture runs. It may return after dismissal. Use Status notification to minimise it where your phone allows, or turn off floating capture to remove it.')}</p>`;openSheetHistory();$('#dim').classList.add('on');$('#sheet').classList.add('on');refreshFloatingStatus()}
async function toggleFloatingSetting(){const P=SB();if(!P)return refreshFloatingStatus();try{const state=await P.overlayStatus();if(state.enabled&&state.allowed)await pauseFloating();else await enableFloating()}catch(e){const el=$('#float-status');if(el)el.textContent=L(e.message||String(e))}}
async function refreshFloatingStatus(){const el=$('#float-status');if(!el)return;const P=SB();if(!P){el.textContent=L('System-wide floating shortcuts are available in Android. Use Test quick capture at the top of this web page to preview the flow.');return}try{const s=await P.overlayStatus();const toggle=$('#float-toggle');if(toggle)toggle.textContent=L(s.enabled&&s.allowed?'Turn off floating shortcut':'Allow floating shortcut');el.textContent=L(s.error||(s.enabled?(s.allowed?(s.running?'On · go to another app to see pending payments':'Starting · reopen QuickSpend if capture does not start'):'Display over other apps permission is off'):'Off · tap Allow floating shortcut to turn it back on'))}catch(e){el.textContent='Could not check floating capture: '+(e.message||e)}}
async function enableFloating(){const P=SB(),el=$('#float-status');if(!P)return refreshFloatingStatus();try{const s=await P.overlayStatus();if(!s.allowed){localStorage.setItem('qs_overlay_waiting','1');localStorage.setItem('qs_overlay_prompted','1');await P.openOverlaySettings();if(el)el.textContent=L('Allow display over other apps for QuickSpend, then return. Quick capture starts automatically.');return}await P.setOverlayEnabled({enabled:true});await refreshFloatingStatus()}catch(e){if(el)el.textContent=L(e.message||String(e))}}

async function testFloating(){const P=SB();if(!P){closeSheet();sms();return}try{await P.testOverlay();const el=$('#float-status');if(el)el.textContent=L('Test ready. Press your phone’s Home button or switch to another app. Tap the ₹ bubble. The preview will not add an expense.')}catch(e){const el=$('#float-status');if(el)el.textContent=L(e.message||String(e))}}
async function askPerm(m){const P=SB();if(!P){if(m)msg('SMS access works in the installed app');return}try{const s=await P.status();if(!s.sms||!s.notif)await P.request();const t=await P.status();if(m)msg(t.sms?'SMS access is on ✓':'SMS access is off. Check Android app permissions')}catch(e){if(m)msg('Could not ask. Check the app settings')}}

// Permission is consented to once in FTUE; an explicit Settings off choice
// remains off across launches. Resume automatically when the system screen closes.
let floatingResumeBusy=false;
async function finishFloatingSetup(){
 const P=SB();if(!P||document.hidden||floatingResumeBusy)return;
 floatingResumeBusy=true;
 try{
  let s=await P.overlayStatus();
  if(s.allowed&&localStorage.getItem('qs_overlay_waiting')==='1'){
   await P.setOverlayEnabled({enabled:true});localStorage.removeItem('qs_overlay_waiting');s=await P.overlayStatus();
  }
  if(s.allowed&&s.enabled&&$('#onb').classList.contains('on')&&OB[ob]&&OB[ob][3]==='overlay')obNext();
  await refreshFloatingStatus();
 }catch(e){console.warn('QuickSpend floating setup:',e&&e.message||e)}finally{floatingResumeBusy=false}
}
async function setupFloatingOnLaunch(){
 const P=SB();if(!P||!seen())return;
 try{
  const s=await P.overlayStatus();
  if(!s.allowed&&s.enabled&&!localStorage.getItem('qs_overlay_prompted')){
   const index=OB.findIndex(step=>step[3]==='overlay');
   if(index>=0){localStorage.setItem('qs_overlay_prompted','1');ob=index;showOb()}
  }else await finishFloatingSetup();
 }catch(e){console.warn('QuickSpend floating startup:',e&&e.message||e)}
}

setInterval(()=>{if(!document.hidden)pull(true)},4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull(false);finishFloatingSetup()}});

window.addEventListener('popstate',()=>{if(ignoredBacks){ignoredBacks--;return}if($('#sheet').classList.contains('on')){closeSheet(false);return}if(historyOpen){closeHistory(false);return}if(currentTab!=='home'){navigateTab('home',false);return}if(homePage!=='overview'){homeOwnEntry=false;homePage='overview';render();$('#s-home').scrollTop=0}});
window.addEventListener('quickspendResume',()=>{pull(true);finishFloatingSetup()});
pull(false);

function later(){if(!cur.manual&&!pending.find(p=>p.id===cur.id))pending.push({id:cur.id,m:cur.m,a:cur.a,d:'Today'});closeSheet();render()}

function dismissSheetGesture(dy,elapsed){return dy>=80||(dy>=35&&dy/Math.max(elapsed,1)>.65)}
function installSheetGestures(){const sheet=$('#sheet');let drag=null;
 sheet.addEventListener('pointerdown',event=>{if(!sheet.classList.contains('on')||!event.target.closest('.grab'))return;drag={id:event.pointerId,y:event.clientY,time:event.timeStamp,dy:0};sheet.style.transition='none';try{sheet.setPointerCapture(event.pointerId)}catch(e){}event.preventDefault()});
 sheet.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;drag.dy=Math.max(0,event.clientY-drag.y);sheet.style.transform='translateY('+drag.dy+'px)';event.preventDefault()});
 const finish=(event,cancelled)=>{if(!drag||drag.id!==event.pointerId)return;const state=drag;drag=null;try{sheet.releasePointerCapture(event.pointerId)}catch(e){}sheet.style.transition='';if(!cancelled&&dismissSheetGesture(state.dy,event.timeStamp-state.time))closeSheet();else sheet.style.transform=''};
 sheet.addEventListener('pointerup',event=>finish(event,false));sheet.addEventListener('pointercancel',event=>finish(event,true));
 document.addEventListener('pointerdown',event=>{if(sheet.classList.contains('on')&&!sheet.contains(event.target)&&!$('#language-choice').classList.contains('on')){event.preventDefault();closeSheet()}},true);
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sheet.classList.contains('on'))closeSheet()});
}
installSheetGestures();

render();
initialiseLanguage();
initialiseAccount();
initialiseUpdates();
