<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>QuickSpend — Expense Manager</title>
<link rel="icon" type="image/png" href="assets/quickspend-icon.png">
<style>
:root{--bg:#09090c;--card:#15151b;--card2:#1d1d25;--tx:#f4f4f6;--mu:#8b8b97;--ac:#c9f36b;--rd:#ff6b6b;--bl:#6bb7ff;--or:#ffb86b;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:var(--tx);font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px}
.demo{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}
.demo button{background:var(--ac);color:#000;border:0;border-radius:99px;padding:8px 14px;font-weight:600;font-size:12px;cursor:pointer}
.phone{position:relative;width:390px;max-width:100%;height:760px;max-height:calc(100% - 50px);background:var(--bg);border-radius:38px;overflow:hidden;border:1px solid #26262e;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:54px 20px 20px;display:none}
.scr.on{display:block}
.scr::-webkit-scrollbar{display:none}
h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.sub{color:var(--mu);font-size:13px;margin-bottom:18px}
.hero{background:linear-gradient(145deg,#20202a,#121217);border:1px solid #2a2a34;border-radius:26px;padding:22px;margin-bottom:16px}
.hero small{color:var(--mu);font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:6px 0 16px}
.row2{display:flex;gap:10px}
.pill{flex:1;background:#0d0d11;border-radius:16px;padding:12px}
.pill b{display:block;font-size:18px;margin-top:2px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;font-size:14px;color:var(--mu)}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #1b1b22}
.ic{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:20px}
.item .m{flex:1;min-width:0}.item .m div{font-size:15px;font-weight:500}.item .m span{font-size:12px;color:var(--mu)}
.amt{font-weight:600;font-size:15px}
.pos{color:var(--ac)}.neg{color:var(--tx)}
.tabs{display:flex;background:rgba(21,21,27,.92);backdrop-filter:blur(20px);border-top:1px solid #22222a;padding:10px 8px 22px}
.tab{flex:1;text-align:center;font-size:10.5px;color:var(--mu);cursor:pointer;position:relative}
.tab i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.tab.on{color:var(--ac)}
.badge{position:absolute;top:-2px;left:56%;background:var(--rd);color:#fff;border-radius:99px;font-size:9px;padding:1px 5px}
.fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:20px;background:var(--ac);color:#000;font-size:28px;border:0;box-shadow:0 8px 24px rgba(201,243,107,.3);cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:40px 0;font-size:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;align-items:center}
.btn{background:var(--card2);color:var(--tx);border:0;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}
.bar{height:8px;border-radius:9px;background:#22222a;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
/* sms + bubble + sheet */
.sms{position:absolute;top:-120px;left:12px;right:12px;background:rgba(40,40,50,.96);border-radius:20px;padding:12px 14px;font-size:12px;z-index:30;transition:top .4s;box-shadow:0 10px 30px #0008}
.sms.show{top:12px}.sms b{font-size:12px;display:block;margin-bottom:2px}
.bubble{position:absolute;right:12px;top:230px;width:54px;height:54px;border-radius:50%;background:rgba(201,243,107,.95);color:#000;display:none;place-items:center;font-size:22px;z-index:20;cursor:pointer;box-shadow:0 6px 20px rgba(201,243,107,.45);animation:p 1.8s infinite}
.bubble img{width:100%;height:100%;object-fit:cover;border-radius:50%}.bubble.show{display:grid}
.bubble em{position:absolute;top:-4px;right:-4px;background:var(--rd);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:1px 6px}
@keyframes p{50%{transform:scale(1.08)}}
.dim{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:-100%;background:#16161c;border-radius:30px 30px 0 0;padding:12px 20px 26px;z-index:50;transition:bottom .3s;border-top:1px solid #2a2a34}
.sheet.on{bottom:0}
.grab{width:40px;height:4px;background:#3a3a45;border-radius:9px;margin:0 auto 14px}
.mer{text-align:center;color:var(--mu);font-size:13px}
.amtbox{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 14px}
.amtbox span{font-size:44px;font-weight:700;letter-spacing:-1px}
.amtbox input{font-size:44px;font-weight:700;width:190px;background:none;border:0;border-bottom:2px solid var(--ac);color:var(--tx);text-align:center;outline:0;font-family:inherit}
.pen{background:var(--card2);border:0;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;color:var(--tx)}
.seg{display:flex;background:#0d0d11;border-radius:14px;padding:3px;margin-bottom:14px}
.seg div{flex:1;text-align:center;padding:9px 0;font-size:12.5px;font-weight:600;border-radius:11px;color:var(--mu);cursor:pointer}
.seg .on{background:var(--card2);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--card2);border-radius:99px;padding:9px 14px;font-size:13px;cursor:pointer;border:1px solid transparent}
.chip.on{border-color:var(--ac);color:var(--ac)}
.who{width:100%;background:#0d0d11;border:1px solid #2a2a34;border-radius:14px;padding:12px;color:var(--tx);font-size:14px;margin-bottom:14px;outline:0;display:none}
.acts{display:flex;gap:10px}
.acts button{border:0;border-radius:16px;padding:15px;font-size:15px;font-weight:700;cursor:pointer}
.save{flex:2;background:var(--ac);color:#000}.later{flex:1;background:var(--card2);color:var(--tx)}
.hint{font-size:11px;color:var(--mu);text-align:center;margin-bottom:10px}
.sheet{max-height:92%;overflow-y:auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;font-size:12px;color:var(--mu);letter-spacing:.8px;text-transform:uppercase}
.mini{width:26px;height:26px;border-radius:50%;border:0;background:var(--card2);color:var(--ac);font-size:17px;line-height:1;cursor:pointer}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.addrow input{flex:1;background:#0d0d11;border:1px solid #2a2a34;border-radius:12px;padding:10px 12px;color:var(--tx);font-size:14px;outline:0}
.dial{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:12px}
.dial::-webkit-scrollbar{display:none}
.dl{flex:none;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;color:#000;margin:0 auto 5px;border:2px solid transparent;transition:.15s}
.dl.on .av{border-color:#fff;transform:scale(1.08)}
.dl.on{color:var(--tx)}
.onb{position:absolute;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;align-items:center;overflow-y:auto;overscroll-behavior:contain;padding:max(12px,env(safe-area-inset-top)) 24px max(20px,env(safe-area-inset-bottom));text-align:center}
.onb.on{display:flex}
.onb-header{display:flex;justify-content:flex-end;width:100%;flex:0 0 auto;min-height:44px}
.oskip{position:static;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;min-height:44px;padding:10px 12px}
.onb-panel{flex:1 0 auto;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 0 20px}
.oe{font-size:clamp(48px,10vh,72px);line-height:1.15;margin-bottom:18px}
.onb h1{font-size:clamp(24px,6vw,30px);line-height:1.15;text-wrap:balance}
.od{color:var(--mu);font-size:15px;line-height:1.5;margin:12px 0 24px;max-width:300px;overflow-wrap:anywhere}
.odots{display:flex;gap:8px;justify-content:center}.odots i{width:8px;height:8px;border-radius:9px;background:#2a2a34}.odots i.on{width:24px;background:var(--ac)}
.onb-actions{flex:0 0 auto;width:100%;max-width:280px;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.onb .obtn{flex:0 0 auto;box-sizing:border-box;min-height:48px;height:auto;width:100%;max-width:280px;border:0;border-radius:14px;padding:13px 20px;font:inherit;font-size:15px;font-weight:700;line-height:22px;cursor:pointer;overflow-wrap:anywhere}
.onb .obtn:disabled{opacity:.65;cursor:wait}
.onb .onb-settings{border:1px solid #34343f;background:var(--card2);color:var(--tx);border-radius:12px;min-height:44px;padding:10px 14px;font:inherit;font-size:13px;cursor:pointer}
.onb .hint{line-height:1.5;margin:0;overflow-wrap:anywhere}
.onb button:focus-visible,.demo button:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
@media(max-height:560px){.onb-panel{padding:8px 0 16px}.oe{font-size:44px;margin-bottom:12px}.od{margin:10px 0 16px;font-size:14px}.onb-header{min-height:40px}.onb{padding-top:8px;padding-bottom:max(12px,env(safe-area-inset-bottom))}}
.native-app body{padding:0;gap:0}.native-app .demo{display:none}.native-app .phone{width:100%;height:100%;max-height:none;border:0;border-radius:0}
.demo{flex-wrap:wrap;justify-content:center;flex-shrink:0;max-width:100%}
.fld{width:100%;background:#0d0d11;border:1px solid #2a2a34;border-radius:14px;padding:12px;color:var(--tx);font-size:14px;margin-bottom:10px;outline:0}
.row2 .fld{flex:1;min-width:0}
.yr{display:flex;gap:6px}.yc{flex:1;text-align:center;font-size:10px;color:var(--mu)}.yb{height:130px;display:flex;gap:2px;align-items:flex-end;margin-bottom:4px}.yb i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
@media(max-width:600px){body{padding:0;gap:6px;justify-content:flex-start;padding-top:env(safe-area-inset-top,0)}.phone{width:100%;max-height:none;height:calc(100% - 44px);border-radius:0;border:0}}
.language-options{display:grid;gap:14px;width:100%;margin-bottom:24px}.language-options button{min-height:72px;border:1px solid #4b5a3f;border-radius:24px;background:var(--card);color:var(--tx);font:inherit;font-size:22px;cursor:pointer;padding:14px 20px;text-align:left}.language-options small{display:block;font-size:13px;color:var(--mu);margin-top:3px}.language-options button:focus-visible{outline:2px solid var(--ac)}html[lang="hi"] .seg>div{font-size:12px;line-height:1.5}html[lang="hi"] .tab{font-size:12px}html[lang="hi"] .chip{line-height:1.5}
</style></head><body>

// Plain HTML bridge: use injected wrappers when present, otherwise the native
// promise transport used by Capacitor's own @capacitor/core runtime.
function SB(n='SmsBridge'){
 const cap=window.Capacitor;
 if(!cap||typeof cap.isNativePlatform!=='function'||!cap.isNativePlatform())return null;
 // SmsBridge always uses the native promise transport. An injected legacy
 // object can be present while lacking methods added in a later app release.
 const existing=cap.Plugins&&cap.Plugins[n];
 if(n!=='SmsBridge'&&existing)return existing;
 const methods=n==='SmsBridge'?['status','request','requestSms','requestNotif','drain','inboxSnapshot','openNotificationSettings','testNotification','overlayStatus','openOverlaySettings','setOverlayEnabled','setLanguage','testOverlay','acknowledgeSaved','completeSms','clearNativeInbox']:n==='Share'?['share']:[];
 const plugin={};
 for(const method of methods)plugin[method]=(options={})=>{
  if(typeof cap.nativePromise==='function')return cap.nativePromise(n,method,options);
  if(existing&&typeof existing[method]==='function')return existing[method](options);
  return Promise.reject(new Error('The installed Android bridge cannot provide '+method+'. Update QuickSpend using your Google Play internal tester link.'));
 };
 return plugin;
}

const BANKS=[[/hdfc/i,'HDFC'],[/sbi|state bank/i,'SBI'],[/icici/i,'ICICI'],[/axis/i,'Axis'],[/kotak/i,'Kotak'],[/\bpnb\b|punjab national/i,'PNB'],[/\bbob\b|baroda/i,'BoB'],[/canara|cnrb|canbnk/i,'Canara'],[/union bank|unionb|\bubi\b/i,'Union Bank'],[/idfc/i,'IDFC First'],[/yes ?bank|yesbnk/i,'Yes Bank'],[/indusind|indusb/i,'IndusInd'],[/idbi/i,'IDBI'],[/bank of india|boiind|\bboi\b/i,'BoI'],[/federal|fedbnk/i,'Federal'],[/\brbl\b/i,'RBL'],[/aubank|au small/i,'AU Bank'],[/paytm|pytm/i,'Paytm Bank'],[/indian bank|indbnk/i,'Indian Bank'],[/central bank/i,'Central Bank'],[/bandhan|bdnsms/i,'Bandhan'],[/hsbc/i,'HSBC'],[/standard chartered|scbank/i,'StanChart'],[/amex|american express/i,'Amex'],[/\buco\b/i,'UCO'],[/karnataka|ktkbnk/i,'KBL'],[/south indian|sibsms/i,'SIB']];
function parseSms(from,body){const t=(body||'').replace(/\s+/g,' ').trim();
 if(!/(debited|credited|spent|paid|received|withdrawn|sent rs|sent inr|purchase|txn|transaction|transferred|refund)/i.test(t))return null;
 if(/(otp|one.?time|verification code|below minimum|min(imum)? (bal|limit)|payment due|amount due|due on|will be debited|request(ed)? (money|from)|collect request|fail|declin|unsuccess|not processed|offer|apply now|congratulations|pre-?approved)/i.test(t))return null;
 const re=/(?:rs\.?|inr|₹)\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)/gi;let m,a=null,x;
 while((m=re.exec(t))){if(!/(bal|limit|lmt|avl|available|outstanding|due)[^0-9]{0,12}$/i.test(t.slice(Math.max(0,m.index-18),m.index))){a=parseFloat(m[1].replace(/,/g,''));break}}
 if(!a&&(x=t.match(/(?:debited|credited)\s+(?:by|for|with)?\s*(?:rs\.?|inr)?\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i)))a=parseFloat(x[1].replace(/,/g,''));
 if(!a)return null;
 const d=t.search(/debited|spent|paid|withdrawn|sent|purchase|transferred|payment of|txn of/i),c=t.search(/credited|received|deposited|refund/i),kind=d<0?'Income':c<0?'Expense':(d<c?'Expense':'Income');
 const bk=BANKS.find(b=>b[0].test(from+' '+t)),bank=bk?bk[1]:'',l4=(x=t.match(/(?:\ba\/c|\bacct?|\bac|\baccount|\bcard)(?:\s*(?:no\.?|number))?\s*(?:ending|xx+|x+|\*+)?\s*([0-9]{3,4})\b/i))?x[1]:'';
 const stop='(?=\\s+(?:on|ref|via|upi|using|from|to|dt|date|avl|bal|not|if|call|\\d{2}[-/])|[.,;(]|$)';
 let mer=null;
 if(x=t.match(new RegExp('VPA\\s+\\S+@\\S+\\s+([A-Za-z][A-Za-z0-9 &._-]{1,28}?)'+stop,'i')))mer=x[1];
 else if(x=t.match(/;\s*([A-Za-z][A-Za-z0-9 &._-]{1,25}?)\s+(?:credited|debited)/i))mer=x[1];
 else if(x=t.match(/\d{2}:\d{2}:\d{2}\s+(?!(?:avl|bal|not|if)\b)([A-Za-z0-9][A-Za-z0-9 &._*-]{1,25}?)\s+(?:avl|bal|not|if)\b/i))mer=x[1];
 else if(x=t.match(new RegExp(kind==='Expense'?'(?:\\bat|\\bto|trf to|towards)\\s+(?!a/c|ac\\b|acct|your|the\\b|vpa|you\\b)([A-Za-z0-9@][A-Za-z0-9@ &._*-]{1,28}?)'+stop:'(?:\\bfrom|\\bby)\\s+(?!a/c|ac\\b|acct|your|the\\b|rs|inr|\\d)(?:vpa\\s+)?([A-Za-z0-9@][A-Za-z0-9@ &._*-]{1,28}?)'+stop,'i')))mer=x[1];
 if(mer){mer=mer.split('@')[0].replace(/[._*-]+/g,' ').trim();if(/^[A-Z0-9 &]+$/.test(mer)||/^[a-z0-9 ]+$/.test(mer))mer=mer.toLowerCase().replace(/\b\w/g,z=>z.toUpperCase());mer=mer.slice(0,24)}
 return{m:mer||(bank?bank+' payment':'Bank payment'),a,kind,acc:bank?(l4?bank+' '+l4:bank):null}}

async function reqPerm(w){const P=SB();if(!P)return 'web';try{if(w==='overlay'){const s=await P.overlayStatus();if(!s.allowed){localStorage.setItem('qs_overlay_waiting','1');localStorage.setItem('qs_overlay_prompted','1');await P.openOverlaySettings();return 'settings'}await P.setOverlayEnabled({enabled:true});localStorage.removeItem('qs_overlay_waiting');return 'granted'}const r=await (w==='notif'?P.requestNotif():P.requestSms());return r[w]?'granted':'denied'}catch(e){return 'error: '+(e&&e.message||e)}}

let pullingNative=false;
function paintReviewStatus(){const el=$('#review-sync');if(el)el.textContent=reviewSyncError?(language==='hi'?'भुगतान सिंक नहीं हुए: ':'Could not sync payments: ')+L(reviewSyncError):SB()?(reviewSyncAt?(language==='hi'?'भुगतान सिंक हुए · '+pending.length+' बाकी':'Payments synced · '+pending.length+' waiting'):L('Checking payment inbox…')):L('Payments are saved in this browser');}
const cleanNativeText=value=>String(value||'').replace(/[<>"']/g,'').trim().slice(0,60);
async function pull(fg){const P=SB();if(!P||pullingNative)return;pullingNative=true;try{
 let response;
 try{response=await P.inboxSnapshot()}catch(e){response=await P.drain()}
 const r=typeof response.payload==='string'?JSON.parse(response.payload):response,ack=[],completed=[];
 for(const field of ['items','entries']){if(typeof r[field]==='string')r[field]=JSON.parse(r[field]);if(!Array.isArray(r[field]))throw new Error('Payment inbox returned invalid '+field+'. Update QuickSpend and retry.');}
 let last=null,n=0,changed=false;
 for(const entry of r.entries||[]){
  const key=String(entry.nativeKey||entry.sourceKey||'');if(!key)continue;
  if(!tx.some(x=>x.nativeKey===key||x.sourceKey===key)){
   const t=['Expense','Income','Lent','Borrowed'].includes(entry.t)?entry.t:'Expense',a=Number(entry.a),ts=Number(entry.ts)||Date.now();
   if(!Number.isFinite(a)||a<=0)continue;
   const parsed=parseSms(entry.smsFrom||'',entry.smsBody||''),acc=cleanNativeText(entry.acc||(parsed&&parsed.acc)||accts[0].n);
   if(!accts.some(x=>x.n===acc))accts.push({n:acc,i:'🏦'});
   const who=t==='Lent'||t==='Borrowed'?cleanNativeText(entry.who)||'Friend':null;
   if(who&&!speed.includes(who))speed.push(who);
   const category=CATS[t].some(x=>x[1]===entry.c)?entry.c:CATS[t][0][1];
   tx.push({id:++sid,t,a,c:category,m:who||cleanNativeText((parsed&&parsed.m)||entry.m)||'Bank payment',who,settled:0,ts,d:fd(ts),acc,nativeKey:key,sourceKey:key});
   changed=true;
  }
  const before=pending.length;pending=pending.filter(x=>x.sourceKey!==key);if(before!==pending.length)changed=true;if(cur.sourceKey===key)closeSheet();ack.push(key);
 }
 for(const o of r.items||[]){
  if(o.demo)continue;
  const key=o.sourceKey||o.ts+'|'+(o.body||'').slice(0,50);
  if(tx.some(x=>x.sourceKey===key)){completed.push(key);continue;}
  if(pending.some(x=>x.sourceKey===key))continue;
  const p=parseSms(o.from||'',o.body||'')||(Number(o.amount)>0?{m:cleanNativeText(o.merchant)||'Bank payment',a:Number(o.amount),kind:o.kind==='Income'?'Income':'Expense',acc:null}:null);
  // Keep unrecognised payments available for manual review; never discard them.
  const payment=p||{m:'Bank payment · check amount',a:'',kind:'Expense',acc:null};
  smsSeen.push(key);
  if(payment.acc&&!accts.some(b=>b.n===payment.acc))accts.push({n:payment.acc,i:'🏦'});
  const it={id:++sid,m:payment.m,a:payment.a,d:fd(o.ts),ts:o.ts,kind:payment.kind,acc:payment.acc,sourceKey:key};pending.push(it);last=it;n++;changed=true;
 }
 smsSeen=smsSeen.slice(-1000);
 if(changed||ack.length)render();
 if(!persist())throw new Error('Payments remain safely in the native inbox because app storage could not be written.');
 if(ack.length)await P.acknowledgeSaved({keys:ack});
 for(const sourceKey of completed)await P.completeSms({sourceKey});
 reviewSyncError='';reviewSyncAt=Date.now();paintReviewStatus();
 if(n){if(fg){inc=last;$('#bub').classList.add('show')}else if(!$('#onb').classList.contains('on'))openSheet(last)}
}catch(e){reviewSyncError=e&&e.message||String(e);paintReviewStatus();console.warn('QuickSpend native inbox:',reviewSyncError)}finally{pullingNative=false}}

// Permission is consented to once in FTUE; an explicit Settings off choice
// remains off across launches. Resume automatically when the system screen closes.
let floatingResumeBusy=false;
async function finishFloatingSetup(){
 const P=SB();if(!P||document.hidden||floatingResumeBusy)return;
 floatingResumeBusy=true;
 try{
  let s=await P.overlayStatus();
  if(s.allowed&&localStorage.getItem('qs_overlay_waiting')==='1'){
   await P.setOverlayEnabled({enabled:true});localStorage.removeItem('qs_overlay_waiting');s=await P.overlayStatus();
  }
  if(s.allowed&&s.enabled&&$('#onb').classList.contains('on')&&OB[ob]&&OB[ob][3]==='overlay')obNext();
  await refreshFloatingStatus();
 }catch(e){console.warn('QuickSpend floating setup:',e&&e.message||e)}finally{floatingResumeBusy=false}
}
async function setupFloatingOnLaunch(){
 const P=SB();if(!P||!seen())return;
 try{
  const s=await P.overlayStatus();
  if(!s.allowed&&s.enabled&&!localStorage.getItem('qs_overlay_prompted')){
   const index=OB.findIndex(step=>step[3]==='overlay');
   if(index>=0){localStorage.setItem('qs_overlay_prompted','1');ob=index;showOb()}
  }else await finishFloatingSetup();
 }catch(e){console.warn('QuickSpend floating startup:',e&&e.message||e)}
}
